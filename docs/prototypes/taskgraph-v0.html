<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Xenica · 任务图原型</title>
<style>
:root{
  --canvas:#191919; --surface:#202020; --raised:#383836;
  --text:#fff; --text2:rgba(255,255,255,.65); --text3:rgba(255,255,255,.42);
  --border:rgba(255,255,255,.20); --border-soft:rgba(255,255,255,.10);
  --blue:#5E9FE8; --blue-t:rgba(94,159,232,.12); --green:#72BC8F; --orange:#DE9255; --red:#E97366;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--canvas);color:var(--text);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif}
body{display:flex;flex-direction:column;min-height:460px;overflow:hidden}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 16px;border-bottom:1px solid var(--border-soft);position:relative;z-index:3;background:var(--canvas)}
.brand{font-weight:600;white-space:nowrap}
.brand span{color:var(--text3);font-weight:400;margin-left:6px;font-size:14px}
form{display:flex;gap:8px;flex:1 1 260px;max-width:380px}
input[type=text]{flex:1;min-width:0;height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-size:15px}
input[type=text]::placeholder{color:var(--text3)}
input[type=text]:focus{outline:none;border-color:var(--blue)}
button{font:inherit;font-size:14px;height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;white-space:nowrap}
button:hover:not(:disabled){background:var(--raised)}
button:disabled{color:var(--text3);cursor:default;border-color:var(--border-soft)}
button.primary{background:var(--blue);border-color:var(--blue);color:#0d1b2a;font-weight:600}
button.primary:hover{background:#7ab0ec}
button:focus-visible,.node:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--text2);height:28px;padding:0 10px;border:1px solid var(--border-soft);border-radius:999px;white-space:nowrap}
.chip b{color:var(--text);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%}
#vp{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab;
  background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px)}
#vp.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:-5000px;top:-5000px;width:10000px;height:10000px;overflow:visible;pointer-events:none}
#eg path{fill:none}
#edges .hit{stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
#edges .ln{stroke:rgba(255,255,255,.30);stroke-width:1.5}
#edges .ln.ok{stroke:rgba(114,188,143,.55)}
#edges .ln.sel{stroke:#fff;stroke-width:2.5}
#edges .tmp{stroke:var(--blue);stroke-width:2;stroke-dasharray:6 5}
.node{position:absolute;width:184px;min-height:60px;display:flex;align-items:center;gap:6px;padding:8px 22px 8px 6px;
  background:var(--surface);border:1px solid var(--border);border-radius:8px;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none}
.node.dragging{cursor:grabbing;z-index:2;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.check{flex:none;width:36px;height:36px;padding:0;border:none;background:none;display:grid;place-items:center;border-radius:6px}
.check:hover:not(:disabled){background:var(--raised)}
.check i{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--text3);display:grid;place-items:center}
.check svg{width:12px;height:12px;stroke:#14261b;stroke-width:2.4;fill:none;opacity:0}
.body{flex:1;min-width:0}
.title{font-size:15px;line-height:1.35;word-break:break-word}
.title input{width:100%;height:28px;font:inherit;font-size:15px;background:var(--canvas);color:var(--text);border:1px solid var(--blue);border-radius:6px;padding:0 6px}
.meta{font-size:14px;line-height:1.3;color:var(--text3);margin-top:2px}
.handle{position:absolute;right:-9px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:var(--canvas);border:2px solid var(--text3);cursor:crosshair}
.handle::before{content:"";position:absolute;inset:-10px}
.handle:hover,.connecting .handle{border-color:var(--blue)}
.node.available{border-color:var(--blue);background:linear-gradient(var(--blue-t),var(--blue-t)),var(--surface)}
.node.available .meta{color:var(--blue)}
.node.available .check i{border-color:var(--blue)}
.node.blocked .title{color:var(--text2)}
.node.done{opacity:.6}
.node.done .title{text-decoration:line-through;color:var(--text2)}
.node.done .meta{color:var(--green)}
.node.done .check i{background:var(--green);border-color:var(--green)}
.node.done .check svg{opacity:1}
.node.selected{box-shadow:0 0 0 2px var(--canvas),0 0 0 4px rgba(255,255,255,.75)}
.node.drop{box-shadow:0 0 0 2px var(--canvas),0 0 0 4px var(--blue)}
.hint{position:absolute;left:16px;bottom:16px;right:16px;pointer-events:none;font-size:14px;color:var(--text3);line-height:1.5}
.hint b{color:var(--text2);font-weight:500}
.zoom{position:absolute;right:16px;top:16px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoom button{width:40px;padding:0;font-size:18px;display:grid;place-items:center}
#toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:var(--raised);color:var(--text);font-size:14px;padding:8px 14px;border-radius:8px;border:1px solid var(--border);opacity:0;transition:opacity .2s;pointer-events:none;z-index:4;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1}
@media (max-width:640px){
  header{padding:10px 12px}
  form{max-width:none;flex-basis:100%}
  .stats{margin-left:0}
  .hint .long{display:none}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header>
  <div class="brand">Xenica<span>任务图 · 原型</span></div>
  <form id="add"><input id="newTitle" type="text" placeholder="新任务，回车添加" aria-label="新任务标题" autocomplete="off"><button class="primary" type="submit">添加</button></form>
  <div class="tools">
    <button id="layoutBtn" type="button" title="按依赖关系自动排列">整理</button>
    <button id="delBtn" type="button" disabled>删除所选</button>
    <button id="resetBtn" type="button" title="恢复示例数据">重置</button>
  </div>
  <div class="stats" aria-live="polite">
    <span class="chip"><i class="dot" style="background:var(--blue)"></i>可做 <b id="sA">0</b></span>
    <span class="chip"><i class="dot" style="background:var(--text3)"></i>等待 <b id="sB">0</b></span>
    <span class="chip"><i class="dot" style="background:var(--green)"></i>完成 <b id="sD">0</b></span>
  </div>
</header>
<div id="vp">
  <div id="world"><svg id="edges"><defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="rgba(255,255,255,.45)"/></marker>
    <marker id="arOk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="rgba(114,188,143,.8)"/></marker>
    <marker id="arSel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="#fff"/></marker>
  </defs><g id="eg" transform="translate(5000 5000)"></g></svg></div>
  <div class="zoom"><button id="zIn" type="button" aria-label="放大">+</button><button id="zOut" type="button" aria-label="缩小">−</button><button id="zFit" type="button" aria-label="显示全部" title="显示全部"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg></button></div>
  <div class="hint"><b>拖动</b>任务调整位置 · 从右侧<b>圆点拖线</b>到另一个任务建立依赖<span class="long"> · <b>双击</b>改名 · 点<b>整理</b>自动布局</span></div>
  <div id="toast" role="status"></div>
</div>
<script>
(()=>{
const KEY='xenica-taskgraph-v1', W=184, GX=56, GY=16;
const SAMPLE={nodes:[
  ['a','整理既有 Repo Branches',1],['b','配置权限与 GitHub',1],['c','思考整理核心特征',0],
  ['d','确定 Demo 范围：任务图',0],['e','确定最小架构与数据模型',0],['f','测试 HTML 嵌入与 UI 原型',0],
  ['g','初始化新 Branch 与文档结构',0],['h','搭建验证闭环（截图 / smoke test）',0],['i','跑通最小链路',0],
  ['j','部署到服务器，手机打开',0],['k','写更多细节的 cases',0]
].map(([id,title,done])=>({id,title,done:!!done,x:0,y:0})),
edges:[['a','c'],['c','d'],['c','k'],['d','e'],['e','g'],['b','g'],['g','h'],['h','i'],['f','i'],['i','j']].map(([from,to])=>({id:from+'>'+to,from,to}))};

const $=s=>document.querySelector(s), vp=$('#vp'), world=$('#world'), eg=$('#eg');
let S, view={x:0,y:0,k:1}, sel=null, els={}, drag=null, lastTap={id:null,t:0}, pts=new Map(), pinch=null, editing=false;
const clone=o=>JSON.parse(JSON.stringify(o));
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.nodes)return s}catch(e){}return null}
const byId=id=>S.nodes.find(n=>n.id===id);
let tt; function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}

function status(){
  const st={};
  S.nodes.forEach(n=>{
    if(n.done){st[n.id]={s:'done'};return}
    const pend=S.edges.filter(e=>e.to===n.id&&!byId(e.from).done).length;
    st[n.id]=pend?{s:'blocked',pend}:{s:'available'};
  });return st;
}
function mkNode(n){
  const el=document.createElement('div');el.className='node';el.dataset.id=n.id;el.tabIndex=0;
  el.innerHTML='<button class="check" type="button" aria-label="切换完成"><i><svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3L12.5 5"/></svg></i></button><div class="body"><div class="title"></div><div class="meta"></div></div><div class="handle" title="拖到另一个任务：建立依赖"></div>';
  el.querySelector('.check').addEventListener('click',ev=>{ev.stopPropagation();const m=byId(n.id);m.done=!m.done;save();render()});
  world.appendChild(el);return el;
}
function render(){
  const st=status();let a=0,b=0,d=0;
  const ids=new Set(S.nodes.map(n=>n.id));
  Object.keys(els).forEach(id=>{if(!ids.has(id)){els[id].remove();delete els[id]}});
  S.nodes.forEach(n=>{
    const el=els[n.id]||(els[n.id]=mkNode(n)), s=st[n.id];
    el.className='node '+s.s+(sel&&sel.type==='node'&&sel.id===n.id?' selected':'')+(drag&&drag.type==='node'&&drag.id===n.id&&drag.moved?' dragging':'');
    if(!el.querySelector('.title input'))el.querySelector('.title').textContent=n.title;
    el.querySelector('.meta').textContent=s.s==='done'?'已完成':s.s==='available'?'可以开始':'等待 '+s.pend+' 项前置';
    el.querySelector('.check').setAttribute('aria-pressed',n.done);
    el.style.transform=`translate(${n.x}px,${n.y}px)`;
    s.s==='available'?a++:s.s==='done'?d++:b++;
  });
  $('#sA').textContent=a;$('#sB').textContent=b;$('#sD').textContent=d;
  $('#delBtn').disabled=!sel;
  drawEdges();
}
const H=id=>els[id]?els[id].offsetHeight:60;
function curve(x1,y1,x2,y2){const dx=Math.max(40,Math.abs(x2-x1)/2);return `M${x1} ${y1}C${x1+dx} ${y1} ${x2-dx} ${y2} ${x2} ${y2}`}
function drawEdges(){
  let h='';
  S.edges.forEach(e=>{
    const s=byId(e.from),t=byId(e.to);if(!s||!t)return;
    const p=curve(s.x+W+9,s.y+H(s.id)/2,t.x-2,t.y+H(t.id)/2);
    const isSel=sel&&sel.type==='edge'&&sel.id===e.id, ok=s.done;
    h+=`<path class="ln${ok?' ok':''}${isSel?' sel':''}" d="${p}" marker-end="url(#${isSel?'arSel':ok?'arOk':'ar'})"/><path class="hit" data-edge="${e.id}" d="${p}"/>`;
  });
  if(drag&&drag.type==='connect'){const s=byId(drag.from);h+=`<path class="tmp" d="${curve(s.x+W+9,s.y+H(s.id)/2,drag.wx,drag.wy)}"/>`}
  eg.innerHTML=h;
}
function applyView(){
  world.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.k})`;
  const g=24*view.k;vp.style.backgroundSize=`${g}px ${g}px`;vp.style.backgroundPosition=`${view.x}px ${view.y}px`;
}
function toWorld(cx,cy){const r=vp.getBoundingClientRect();return{x:(cx-r.left-view.x)/view.k,y:(cy-r.top-view.y)/view.k}}
function zoomAt(f,cx,cy){
  const r=vp.getBoundingClientRect(),px=cx-r.left,py=cy-r.top,k=Math.min(2,Math.max(.35,view.k*f));
  view.x=px-(px-view.x)*k/view.k;view.y=py-(py-view.y)*k/view.k;view.k=k;applyView();
}
function fit(minK){
  if(!S.nodes.length){view={x:40,y:40,k:1};applyView();return}
  const xs=S.nodes.map(n=>n.x),ys=S.nodes.map(n=>n.y),x0=Math.min(...xs),y0=Math.min(...ys),
    x1=Math.max(...S.nodes.map(n=>n.x+W)),y1=Math.max(...S.nodes.map(n=>n.y+H(n.id)));
  const vw=vp.clientWidth,vh=vp.clientHeight,pad=48;
  const k=Math.min(1,Math.max(minK||.35,Math.min((vw-pad*2-48)/(x1-x0),(vh-pad*2-40)/(y1-y0))));
  const cw=(x1-x0)*k,x=cw>vw-pad*2-48?pad-x0*k:(vw-cw)/2-x0*k;
  view={k,x,y:Math.max(pad,(vh-40-(y1-y0)*k)/2)-y0*k};applyView();
}
// ---- 自动布局：按依赖分层（左→右），重心法减少交叉 ----
function layout(){
  const ids=S.nodes.map(n=>n.id),pred={},succ={};ids.forEach(i=>{pred[i]=[];succ[i]=[]});
  S.edges.forEach(e=>{succ[e.from].push(e.to);pred[e.to].push(e.from)});
  const indeg={};ids.forEach(i=>indeg[i]=pred[i].length);
  const q=ids.filter(i=>!indeg[i]),order=[];while(q.length){const v=q.shift();order.push(v);succ[v].forEach(w=>{if(--indeg[w]===0)q.push(w)})}
  const L={};order.forEach(v=>L[v]=pred[v].length?Math.max(...pred[v].map(p=>L[p]+1)):0);
  [...order].reverse().forEach(v=>{if(!pred[v].length&&succ[v].length)L[v]=Math.min(...succ[v].map(s=>L[s]))-1});
  const n=Math.max(0,...order.map(v=>L[v])),layers=Array.from({length:n+1},()=>[]);order.forEach(v=>layers[L[v]].push(v));
  const pos={};const idx=()=>layers.forEach(l=>l.forEach((v,i)=>pos[v]=i/(Math.max(1,l.length-1))));idx();
  const bary=(l,nb)=>{const val={};l.forEach(v=>val[v]=nb[v].length?nb[v].reduce((a,u)=>a+pos[u],0)/nb[v].length:pos[v]);l.sort((a,b)=>val[a]-val[b]);l.forEach((v,i)=>pos[v]=i/(Math.max(1,l.length-1)))};
  for(let it=0;it<8;it++){for(let i=1;i<=n;i++)bary(layers[i],pred);for(let i=n-1;i>=0;i--)bary(layers[i],succ)}
  const target={};
  layers.forEach((l,li)=>{const tot=l.reduce((a,v)=>a+H(v),0)+GY*(l.length-1);let y=-tot/2;l.forEach(v=>{target[v]={x:li*(W+GX),y};y+=H(v)+GY})});
  return target;
}
function animateTo(target,done){
  const from={};S.nodes.forEach(n=>from[n.id]={x:n.x,y:n.y});
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,T=reduce?0:320,t0=performance.now();
  const step=now=>{const p=T?Math.min(1,(now-t0)/T):1,e=1-Math.pow(1-p,3);
    S.nodes.forEach(n=>{const a=from[n.id],b=target[n.id];if(!b)return;n.x=a.x+(b.x-a.x)*e;n.y=a.y+(b.y-a.y)*e});
    render();if(p<1)requestAnimationFrame(step);else{save();done&&done()}};
  requestAnimationFrame(step);
}
function tidy(){animateTo(layout(),()=>fit(.8))}
function reaches(a,b){const st=[a],seen=new Set();while(st.length){const v=st.pop();if(v===b)return true;if(seen.has(v))continue;seen.add(v);S.edges.forEach(e=>{if(e.from===v)st.push(e.to)})}return false}
function addEdge(a,b){
  if(a===b)return;
  if(S.edges.some(e=>e.from===a&&e.to===b))return toast('这条依赖已经存在');
  if(reaches(b,a))return toast('会形成循环依赖，已取消');
  S.edges.push({id:a+'>'+b,from:a,to:b});save();toast(`「${byId(b).title}」现在依赖「${byId(a).title}」`);
}
function delSel(){
  if(!sel)return;
  if(sel.type==='node'){S.nodes=S.nodes.filter(n=>n.id!==sel.id);S.edges=S.edges.filter(e=>e.from!==sel.id&&e.to!==sel.id)}
  else S.edges=S.edges.filter(e=>e.id!==sel.id);
  sel=null;save();render();
}
function rename(id){
  const el=els[id],t=el.querySelector('.title'),n=byId(id);editing=true;
  t.innerHTML='';const inp=document.createElement('input');inp.value=n.title;t.appendChild(inp);inp.focus();inp.select();
  const end=ok=>{if(!editing)return;editing=false;if(ok&&inp.value.trim())n.title=inp.value.trim();t.textContent=n.title;save();render()};
  inp.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')end(true);if(e.key==='Escape')end(false)});
  inp.addEventListener('blur',()=>end(true));inp.addEventListener('pointerdown',e=>e.stopPropagation());
}
// ---- 指针交互 ----
vp.addEventListener('pointerdown',e=>{
  if(e.target.closest('.check')||e.target.closest('.zoom')||e.target.closest('.title input'))return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const nodeEl=e.target.closest('.node'),hit=e.target.closest('[data-edge]');
  if(pts.size===2&&drag&&drag.type==='pan'){const [p,q]=[...pts.values()];pinch={d:Math.hypot(p.x-q.x,p.y-q.y)};drag=null;return}
  vp.setPointerCapture(e.pointerId);
  if(e.target.classList.contains('handle')){const id=nodeEl.dataset.id,w=toWorld(e.clientX,e.clientY);drag={type:'connect',from:id,wx:w.x,wy:w.y,pid:e.pointerId};nodeEl.classList.add('connecting');drawEdges();return}
  if(nodeEl){const n=byId(nodeEl.dataset.id);drag={type:'node',id:n.id,sx:e.clientX,sy:e.clientY,ox:n.x,oy:n.y,moved:false,pid:e.pointerId};return}
  if(hit){sel={type:'edge',id:hit.dataset.edge};render();return}
  drag={type:'pan',sx:e.clientX,sy:e.clientY,ox:view.x,oy:view.y,moved:false,pid:e.pointerId};
});
let dropEl=null;
vp.addEventListener('pointermove',e=>{
  if(pts.has(e.pointerId))pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&pts.size===2){const [p,q]=[...pts.values()],d=Math.hypot(p.x-q.x,p.y-q.y);zoomAt(d/pinch.d,(p.x+q.x)/2,(p.y+q.y)/2);pinch.d=d;return}
  if(!drag||e.pointerId!==drag.pid)return;
  if(drag.type==='node'){const dx=(e.clientX-drag.sx)/view.k,dy=(e.clientY-drag.sy)/view.k;
    if(!drag.moved&&Math.hypot(dx,dy)*view.k<4)return;drag.moved=true;const n=byId(drag.id);n.x=drag.ox+dx;n.y=drag.oy+dy;render()}
  else if(drag.type==='pan'){const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(!drag.moved&&Math.hypot(dx,dy)<4)return;drag.moved=true;vp.classList.add('panning');view.x=drag.ox+dx;view.y=drag.oy+dy;applyView()}
  else if(drag.type==='connect'){const w=toWorld(e.clientX,e.clientY);drag.wx=w.x;drag.wy=w.y;
    const t=document.elementFromPoint(e.clientX,e.clientY),ne=t&&t.closest('.node');
    if(dropEl&&dropEl!==ne)dropEl.classList.remove('drop');dropEl=ne&&ne.dataset.id!==drag.from?ne:null;if(dropEl)dropEl.classList.add('drop');drawEdges()}
});
function up(e){
  pts.delete(e.pointerId);if(pts.size<2)pinch=null;
  if(!drag||e.pointerId!==drag.pid)return;
  const d=drag;drag=null;vp.classList.remove('panning');
  if(d.type==='node'){
    if(d.moved){save();render();return}
    const now=Date.now();
    if(lastTap.id===d.id&&now-lastTap.t<350){lastTap={id:null,t:0};rename(d.id);return}
    lastTap={id:d.id,t:now};sel={type:'node',id:d.id};render();els[d.id].focus({preventScroll:true});
  }else if(d.type==='pan'){if(!d.moved){sel=null;render()}}
  else if(d.type==='connect'){
    document.querySelectorAll('.connecting').forEach(x=>x.classList.remove('connecting'));
    if(dropEl){addEdge(d.from,dropEl.dataset.id);dropEl.classList.remove('drop');dropEl=null}
    render();
  }
}
vp.addEventListener('pointerup',up);vp.addEventListener('pointercancel',up);
vp.addEventListener('wheel',e=>{e.preventDefault();
  if(e.ctrlKey||e.metaKey)zoomAt(Math.exp(-e.deltaY*.01),e.clientX,e.clientY);
  else{view.x-=e.deltaX;view.y-=e.deltaY;applyView()}},{passive:false});
document.addEventListener('keydown',e=>{
  if(editing||e.target.tagName==='INPUT')return;
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();delSel()}
  if(e.key==='Enter'&&sel&&sel.type==='node'){e.preventDefault();rename(sel.id)}
  if(e.key==='Escape'){sel=null;render()}
});
$('#add').addEventListener('submit',e=>{
  e.preventDefault();const v=$('#newTitle').value.trim();if(!v)return;
  const c=toWorld(vp.getBoundingClientRect().left+vp.clientWidth/2,vp.getBoundingClientRect().top+vp.clientHeight/2);
  let x=c.x-W/2,y=c.y-30;const hit=(x,y)=>S.nodes.some(m=>x<m.x+W+16&&x+W+16>m.x&&y<m.y+H(m.id)+16&&y+76>m.y);
  for(let i=0;i<40&&hit(x,y);i++)y+=40;
  const n={id:'n'+Date.now().toString(36),title:v,done:false,x,y};
  S.nodes.push(n);sel={type:'node',id:n.id};$('#newTitle').value='';save();render();
  toast('已添加，从右侧圆点拖线建立依赖');
});
$('#layoutBtn').onclick=tidy;$('#delBtn').onclick=delSel;
$('#resetBtn').onclick=()=>{S=clone(SAMPLE);sel=null;render();const t=layout();S.nodes.forEach(n=>Object.assign(n,t[n.id]));render();fit(.8);save();toast('已恢复示例数据')};
$('#zIn').onclick=()=>{const r=vp.getBoundingClientRect();zoomAt(1.2,r.left+r.width/2,r.top+r.height/2)};
$('#zOut').onclick=()=>{const r=vp.getBoundingClientRect();zoomAt(1/1.2,r.left+r.width/2,r.top+r.height/2)};
$('#zFit').onclick=()=>fit();
addEventListener('resize',()=>{});
// ---- 启动 ----
const saved=load();S=saved||clone(SAMPLE);render();
if(!saved){const t=layout();S.nodes.forEach(n=>Object.assign(n,t[n.id]));render()}
fit(.8);applyView();
})();
</script>
</body>
</html>
