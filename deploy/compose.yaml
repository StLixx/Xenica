# 部署：cp .env.example .env，填好后 docker compose up -d
# 数据库不对外暴露；应用端口只绑到 XENICA_BIND（生产填 Tailscale IP）。
name: xenica

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: xenica
      POSTGRES_DB: xenica
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?在 .env 里设置 POSTGRES_PASSWORD}
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xenica -d xenica"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: ${XENICA_IMAGE:-ghcr.io/stlixx/xenica:latest}
    build:
      context: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://xenica:${POSTGRES_PASSWORD}@db:5432/xenica
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "${XENICA_BIND:-127.0.0.1}:${XENICA_PORT:-8080}:8080"

volumes:
  db:
