# 一个 Xenica 实例 = 应用 + 数据库。正式站和每个 PR 预览都用这一份，只是环境变量不同：
#   正式站：docker compose -p xenica --env-file .env up -d
#   预览：  部署器（deployer/deploy.sh）自动用 -p xenica-pr-N 起停
# 对外入口是 edge/compose.yaml 里的 Traefik，按域名把请求分给各实例；这里不映射任何端口。
name: xenica

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: xenica
      POSTGRES_DB: xenica
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?在 .env 里设置 POSTGRES_PASSWORD}
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xenica -d xenica"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: ${XENICA_IMAGE:-ghcr.io/stlixx/xenica:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://xenica:${POSTGRES_PASSWORD}@db:5432/xenica
      XENICA_SEED: ${XENICA_SEED:-}
      RUST_LOG: ${RUST_LOG:-info}
    networks: [default, edge]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=xenica-edge"
      # XENICA_ALIAS_RULE：部署器给「最近更新的预览」加上固定域名 preview.<域名>
      - "traefik.http.routers.${XENICA_NAME:-prod}.rule=Host(`${XENICA_HOST:-xenica.truebigsand.top}`)${XENICA_ALIAS_RULE:-}"
      - "traefik.http.routers.${XENICA_NAME:-prod}.entrypoints=web"
      - "traefik.http.services.${XENICA_NAME:-prod}.loadbalancer.server.port=8080"

volumes:
  db:

networks:
  edge:
    name: xenica-edge
    external: true
