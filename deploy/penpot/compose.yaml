name: penpot
services:
  penpot-frontend:
    image: ${PENPOT_FRONTEND_IMAGE:?set immutable image digest}
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1
    command:
      - /bin/bash
      - -c
      - "sed 's/^worker_processes auto;/worker_processes 1;/' /etc/nginx/nginx.conf > /tmp/penpot-nginx.conf; cat /tmp/penpot-nginx.conf > /etc/nginx/nginx.conf; if [ -f /etc/nginx/overrides/server.d/mcp-locations.conf ]; then sed '/^location /a\\    access_log off;\\n    error_log /dev/null crit;\\n    proxy_buffering off;\\n    proxy_read_timeout 300s;' /etc/nginx/overrides/server.d/mcp-locations.conf > /tmp/penpot-mcp.conf; cat /tmp/penpot-mcp.conf > /etc/nginx/overrides/server.d/mcp-locations.conf; fi; exec nginx -g 'daemon off;'"
    ports:
      - "${PENPOT_BIND:-100.100.1.202}:9001:8080"
    volumes:
      - /mnt/HDD/penpot/assets:/opt/data/assets:ro
      - /opt/stacks/penpot/selfhost.css:/var/www/app/css/selfhost.css:ro
      - /opt/stacks/penpot/frontend-custom.conf:/etc/nginx/overrides/server.d/selfhost.conf:ro
    environment:
      PENPOT_PUBLIC_URI: https://penpot.truebigsand.top
      PENPOT_FLAGS: disable-registration enable-login-with-password disable-onboarding enable-mcp enable-webhooks enable-access-tokens enable-admin-console
      PENPOT_MCP_URI: http://penpot-mcp:4401
      PENPOT_MCP_URI_WS: http://penpot-mcp:4402
      PENPOT_ADMIN_CONSOLE_URI: http://penpot-admin-console:3000
      PENPOT_HTTP_SERVER_MAX_BODY_SIZE: "104857600"
    depends_on:
      - penpot-backend
      - penpot-exporter
      - penpot-mcp
      - penpot-admin-console
    networks: [penpot]
  penpot-backend:
    image: ${PENPOT_BACKEND_IMAGE:?set immutable image digest}
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    env_file: /etc/penpot-ops/backend.env
    environment:
      PENPOT_FLAGS: disable-registration enable-login-with-password enable-mcp enable-webhooks enable-access-tokens enable-admin-console
      PENPOT_ADMIN_CONSOLE_URI: http://penpot-admin-console:3000
      JAVA_TOOL_OPTIONS: -Xmx768m -XX:ActiveProcessorCount=2 -Djava.net.preferIPv6Addresses=true
    volumes:
      - /mnt/HDD/penpot/assets:/opt/data/assets
      - /opt/stacks/penpot/runtime-patches:/opt/penpot/runtime-patches:ro
      - /opt/stacks/penpot/runtime-patches/run.sh:/opt/penpot/backend/run.sh:ro
    depends_on:
      penpot-valkey:
        condition: service_healthy
    networks: [penpot]
  penpot-exporter:
    image: ${PENPOT_EXPORTER_IMAGE:?set immutable image digest}
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2
    env_file: /etc/penpot-ops/exporter.env
    environment:
      PENPOT_PUBLIC_URI: https://penpot.truebigsand.top
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080
      PENPOT_REDIS_URI: redis://penpot-valkey/0
      PENPOT_FLAGS: disable-registration enable-login-with-password
    networks: [penpot]
  penpot-valkey:
    image: ${PENPOT_VALKEY_IMAGE:?set immutable image digest}
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1
    command: [valkey-server, --maxmemory, 128mb, --maxmemory-policy, volatile-lfu]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [penpot]
  penpot-mcp:
    image: ${PENPOT_MCP_IMAGE:?set immutable image digest}
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    environment:
      PENPOT_MCP_REMOTE_MODE: "true"
      PENPOT_MCP_REPL_ENABLE: "false"
      PENPOT_MCP_LOG_LEVEL: warn
    networks: [penpot]
  penpot-admin-console:
    image: ${PENPOT_ADMIN_CONSOLE_IMAGE:?set immutable image digest}
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    env_file: /etc/penpot-ops/admin-console.env
    environment:
      PENPOT_PUBLIC_URI: https://penpot.truebigsand.top
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080
    networks: [penpot]
networks:
  penpot:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.21.0.0/16
        - subnet: fd42:7065:6e70:6f74::/64
