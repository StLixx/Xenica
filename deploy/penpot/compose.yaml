name: penpot
services:
  penpot-frontend:
    image: ${PENPOT_FRONTEND_IMAGE:?set immutable image digest}
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1
    command:
      - /bin/bash
      - -c
      - "sed 's/^worker_processes auto;/worker_processes 1;/' /etc/nginx/nginx.conf > /tmp/penpot-nginx.conf; cat /tmp/penpot-nginx.conf > /etc/nginx/nginx.conf; exec nginx -g 'daemon off;'"
    ports:
      - "${PENPOT_BIND:-100.100.1.202}:9001:8080"
    volumes:
      - /mnt/HDD/penpot/assets:/opt/data/assets:ro
    environment:
      PENPOT_PUBLIC_URI: https://penpot.truebigsand.top
      PENPOT_FLAGS: disable-registration enable-login-with-password disable-onboarding
      PENPOT_HTTP_SERVER_MAX_BODY_SIZE: "104857600"
    depends_on:
      - penpot-backend
      - penpot-exporter
    networks: [penpot]
  penpot-backend:
    image: ${PENPOT_BACKEND_IMAGE:?set immutable image digest}
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    env_file: /etc/penpot-ops/backend.env
    volumes:
      - /mnt/HDD/penpot/assets:/opt/data/assets
    depends_on:
      penpot-valkey:
        condition: service_healthy
    networks: [penpot]
  penpot-exporter:
    image: ${PENPOT_EXPORTER_IMAGE:?set immutable image digest}
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2
    env_file: /etc/penpot-ops/exporter.env
    environment:
      PENPOT_PUBLIC_URI: https://penpot.truebigsand.top
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080
      PENPOT_REDIS_URI: redis://penpot-valkey/0
      PENPOT_FLAGS: disable-registration enable-login-with-password
    networks: [penpot]
  penpot-valkey:
    image: ${PENPOT_VALKEY_IMAGE:?set immutable image digest}
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1
    command: [valkey-server, --maxmemory, 128mb, --maxmemory-policy, volatile-lfu]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [penpot]
networks:
  penpot: {}
