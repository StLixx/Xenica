# Insert into the existing HTTPS virtual host; do not publish a second MCP port.
# The query string carries a personal credential, so omit request/error URL logs.
location ^~ /mcp/ {
    access_log off;
    error_log /dev/null crit;
    proxy_pass http://100.100.1.202:9001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 300s;
}
