<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>设置 · 个人资料 · Xenica</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>*{box-sizing:border-box;margin:0;padding:0}html,body{background:#000;color:var(--ant-color-text);font-family:var(--ant-font-family);-webkit-font-smoothing:antialiased;min-height:100vh}.app{min-height:100vh;display:grid;grid-template-columns:260px 1fr;grid-template-rows:36px 1fr 28px}.hd{grid-column:1/-1;background:var(--ant-color-bg-elevated);border-bottom:1px solid var(--ant-color-border);padding:0 16px;display:flex;align-items:center;gap:12px;font-size:12px}.hd .brand{font-weight:700;letter-spacing:.14em}.hd .brand .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ant-color-primary);box-shadow:0 0 6px var(--ant-color-primary);margin-right:8px;vertical-align:middle}.hd .right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--ant-color-text-tertiary)}.sider{background:var(--ant-color-bg-base);border-right:1px solid var(--ant-color-border);padding:18px 12px;overflow:auto}.sider h3{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ant-color-text-tertiary);font-family:ui-monospace,monospace;padding:8px 12px;margin-bottom:4px;font-weight:600}.si{display:flex;align-items:center;gap:12px;padding:10px 12px;font-size:13px;color:var(--ant-color-text-secondary);border-radius:8px;cursor:default;margin-bottom:2px}.si:hover{background:var(--ant-color-fill-secondary);color:var(--ant-color-text)}.si.on{background:var(--ant-color-primary-bg);color:var(--ant-color-primary-text);font-weight:500}.si .ico{width:18px;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--ant-color-text-tertiary)}.si.on .ico{color:var(--ant-color-primary-text)}.content{background:var(--ant-color-bg-base);padding:40px 56px;overflow:auto}.ch{margin-bottom:32px}.ch .crumb{font-size:11px;color:var(--ant-color-text-tertiary);font-family:ui-monospace,monospace;margin-bottom:6px}.ch h1{font-size:32px;font-weight:600;letter-spacing:-.01em;color:var(--ant-color-text)}.ch p{font-size:13px;color:var(--ant-color-text-secondary);margin-top:6px;max-width:600px;line-height:1.6}.card{background:var(--ant-color-bg-container);border:1px solid var(--ant-color-border);border-radius:12px;padding:24px 28px;max-width:780px}.row{display:grid;grid-template-columns:160px 1fr;gap:18px;padding:14px 0;border-bottom:1px solid var(--ant-color-border-secondary);align-items:start}.row:last-of-type{border-bottom:0}.row .k{font-size:13px;color:var(--ant-color-text-secondary);padding-top:8px}.row .k b{color:var(--ant-color-text);font-weight:500;display:block;margin-bottom:2px}.row .k .hint{font-size:11px;color:var(--ant-color-text-tertiary);font-weight:400}.row .v{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.inp{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;height:32px;padding:0 11px;background:var(--ant-color-bg-elevated);border:1px solid var(--ant-color-border);border-radius:6px;color:var(--ant-color-text);font-size:13px}.inp input{flex:1;background:transparent;border:none;outline:none;color:var(--ant-color-text);font-size:13px;font-family:inherit}.sw{width:36px;height:20px;border-radius:100px;background:var(--ant-color-fill-tertiary);position:relative;cursor:default;border:1px solid var(--ant-color-border);flex:none}.sw::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--ant-color-text-secondary);transition:all .15s}.sw.on{background:var(--ant-color-primary);border-color:var(--ant-color-primary)}.sw.on::after{left:18px;background:#fff}.save-bar{padding:18px 0 0;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--ant-color-border);margin-top:24px}.save-bar .status{font-size:12px;color:var(--ant-color-text-tertiary);font-family:ui-monospace,monospace}.save-bar .status b{color:var(--ant-color-success)}.ft{grid-column:1/-1;background:var(--ant-color-bg-elevated);border-top:1px solid var(--ant-color-border);padding:0 16px;display:flex;align-items:center;font-size:11px;color:var(--ant-color-text-secondary)}.ft .right{margin-left:auto}</style></head><body>
<div class="app"><div class="hd"><div class="brand"><span class="dot"></span>XENICA</div><div style="color:var(--ant-color-text-tertiary)">· 设置</div><div class="right"><span>⌘,</span><div class="av" style="width:22px;height:22px;font-size:10px">XL</div></div></div><div class="sider"><h3>账户</h3><div class="si"><span class="ico">◐</span>总览</div><div class="si on"><span class="ico">☻</span>个人资料</div><div class="si"><span class="ico">⌬</span>订阅与计费</div><h3 style="margin-top:14px">外观</h3><div class="si"><span class="ico">◑</span>主题</div><div class="si"><span class="ico">⌗</span>字体与间距</div><div class="si"><span class="ico">⌘</span>快捷键</div><h3 style="margin-top:14px">编辑器</h3><div class="si"><span class="ico">▦</span>画布设置</div><div class="si"><span class="ico">⌬</span>自动布局</div><div class="si"><span class="ico">⤓</span>导入与导出</div><h3 style="margin-top:14px">数据</h3><div class="si"><span class="ico">⇅</span>同步与备份</div><div class="si"><span class="ico">⚠</span>危险操作</div><h3 style="margin-top:14px">其他</h3><div class="si"><span class="ico">▦</span>扩展</div><div class="si"><span class="ico">i</span>关于</div></div><div class="content"><div class="ch"><div class="crumb">设置 · 账户 · 个人资料</div><h1>个人资料</h1><p>头像与基础信息会显示在评论、@提及、协作头像列表中。</p></div><div class="card"><div class="row"><div class="k"><b>头像</b><span class="hint">PNG / JPG · ≤ 2 MB</span></div><div class="v"><div style="width:64px;height:64px;border-radius:14px;background:linear-gradient(135deg,#14b8a6,#0d9488);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:700">XL</div><button class="btn btn-default btn-sm">⊟ 上传</button><button class="btn btn-ghost btn-sm">⊘ 移除</button></div></div><div class="row"><div class="k"><b>姓名</b><span class="hint">必填</span></div><div class="v"><div class="inp"><input value="谢凌"/></div></div></div><div class="row"><div class="k"><b>用户名</b><span class="hint">@提及使用</span></div><div class="v"><div class="inp">@<input value="xie_ling"/></div></div></div><div class="row"><div class="k"><b>邮箱</b><span class="hint">登录与通知</span></div><div class="v"><div class="inp"><input value="[email protected]"/></div><span class="tag tag-success" style="font-size:10px">已验证</span></div></div><div class="row"><div class="k"><b>个人简介</b><span class="hint">≤ 140 字</span></div><div class="v"><div style="flex:1;display:flex;background:var(--ant-color-bg-elevated);border:1px solid var(--ant-color-border);border-radius:6px;padding:8px 11px"><textarea style="flex:1;background:transparent;border:none;outline:none;color:var(--ant-color-text);font-size:13px;font-family:inherit;resize:none;width:100%;min-height:48px">前端设计师 / 在 Xenica 做节点画布 / 关注自动布局与设计系统</textarea></div></div></div><div class="row"><div class="k"><b>时区</b><span class="hint">影响日期</span></div><div class="v"><div class="inp">Asia/Shanghai (UTC+8)<span style="margin-left:auto;color:var(--ant-color-text-tertiary)">▾</span></div></div></div><div class="save-bar"><span class="status">● <b>已保存</b> · 5 分钟前</span><div style="display:flex;gap:8px"><button class="btn btn-ghost">取消</button><button class="btn btn-primary">⌘S 保存</button></div></div></div></div><div class="ft"><span>设置 · 个人资料</span><span class="right">⌘, 关闭</span></div></div>
</body></html>
