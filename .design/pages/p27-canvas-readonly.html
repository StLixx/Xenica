<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>画布 · 只读演示态 · Xenica</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000;color:var(--ant-color-text);font-family:var(--ant-font-family);-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden}
  .app{height:100vh;display:grid;grid-template-rows:36px 1fr 28px}
  .hd{background:var(--ant-color-bg-elevated);border-bottom:1px solid var(--ant-color-border);padding:0 16px;display:flex;align-items:center;gap:12px;font-size:12px}
  .hd .brand{font-weight:700;letter-spacing:.14em}
  .hd .brand .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ant-color-primary);box-shadow:0 0 6px var(--ant-color-primary);margin-right:8px;vertical-align:middle}
  .hd .crumbs{color:var(--ant-color-text-secondary)}
  .hd .crumbs b{color:var(--ant-color-text);font-weight:500}
  .hd .right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--ant-color-text-tertiary)}
  .ro-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:#4096ff20;color:#4096ff;font-size:11px;letter-spacing:.08em;border:1px solid #4096ff40}
  .ro-badge i{width:6px;height:6px;border-radius:50%;background:#4096ff;box-shadow:0 0 6px #4096ff80}
  .mid{background:var(--ant-color-bg-layout);position:relative;overflow:hidden}
  .canvas-bg{position:absolute;inset:0;background-image:var(--xe-bg-grid);background-size:40px 40px;opacity:.4}
  .node{position:absolute;background:var(--ant-color-bg-elevated);border:1px solid var(--ant-color-border);border-radius:10px;padding:12px 16px;min-width:160px;font-size:13px;box-shadow:0 4px 12px #00000060;cursor:default;position:relative}
  .node .lock{position:absolute;top:8px;right:8px;font-size:11px;color:var(--ant-color-text-tertiary);opacity:.5}
  .node h4{font-size:13px;font-weight:600;margin-bottom:4px}
  .node .meta{font-size:10px;color:var(--ant-color-text-tertiary);font-family:ui-monospace,monospace}
  .node .author{display:flex;align-items:center;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--ant-color-border-secondary);font-size:10px;color:var(--ant-color-text-tertiary)}
  .vtool{position:absolute;left:14px;top:50%;transform:translateY(-50%);background:var(--ant-color-bg-elevated);border:1px solid var(--ant-color-border);border-radius:8px;padding:4px;display:flex;flex-direction:column;gap:2px;box-shadow:0 8px 24px #00000080}
  .vb{width:28px;height:28px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--ant-color-text-secondary);font-size:13px}
  .vb.on{background:var(--ant-color-primary-bg);color:var(--ant-color-primary-text)}
  .vb:hover{background:var(--ant-color-fill-secondary)}
  .vb.disabled{opacity:.3;cursor:not-allowed}
  .present-controls{position:absolute;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ant-color-bg-elevated);border:1px solid var(--ant-color-border);border-radius:999px;padding:8px 12px;display:flex;align-items:center;gap:8px;box-shadow:0 12px 30px #00000080}
  .pc-btn{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ant-color-text-secondary);font-size:14px}
  .pc-btn:hover{background:var(--ant-color-fill-secondary)}
  .pc-btn.primary{background:var(--ant-color-primary);color:#fff}
  .pc-sep{width:1px;height:20px;background:var(--ant-color-border);margin:0 4px}
  .pc-progress{font-family:ui-monospace,monospace;font-size:11px;color:var(--ant-color-text-tertiary);padding:0 8px;min-width:50px;text-align:center}
  .ft{background:var(--ant-color-bg-elevated);border-top:1px solid var(--ant-color-border);padding:0 16px;display:flex;align-items:center;font-size:11px;color:var(--ant-color-text-secondary)}
  .ft .right{margin-left:auto}
</style></head><body>
<div class="app">
  <div class="hd">
    <div class="brand"><span class="dot"></span>XENICA</div>
    <div class="crumbs">· <b>林奇</b> 分享的画布 · <b>Antd 6 调研</b></div>
    <div class="right">
      <span class="ro-badge"><i></i>只读模式</span>
      <span>⌘K</span>
      <div class="av" style="width:22px;height:22px;font-size:10px">LQ</div>
    </div>
  </div>
  <div class="mid">
    <div class="canvas-bg"></div>
    <svg style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none">
      <path d="M 280 220 Q 360 180 440 220" class="edge"/>
      <path d="M 280 220 Q 200 320 240 420" class="edge"/>
      <path d="M 440 220 Q 540 280 600 380" class="edge"/>
    </svg>
    <div class="node" style="left:200px;top:180px"><span class="lock">⊟</span><h4>晨间笔记</h4><div class="meta">日记</div><div class="author"><div class="av av-sm">XL</div>谢凌 · 2 小时前</div></div>
    <div class="node" style="left:360px;top:180px"><span class="lock">⊟</span><h4>Antd 6 调研笔记</h4><div class="meta">文档 · ~340 字</div><div class="author"><div class="av av-sm" style="background:linear-gradient(135deg,#4096ff,#1677ff)">LQ</div>林奇 · 5 分钟前</div></div>
    <div class="node" style="left:160px;top:380px"><span class="lock">⊟</span><h4>本周目标</h4><div class="meta">任务</div><div class="author"><div class="av av-sm">XL</div>谢凌 · 昨天</div></div>
    <div class="node" style="left:520px;top:340px"><span class="lock">⊟</span><h4>节点布局策略 v2</h4><div class="meta">ADR</div><div class="author"><div class="av av-sm" style="background:linear-gradient(135deg,#4096ff,#1677ff)">LQ</div>林奇 · 1 周前</div></div>
    <div class="vtool">
      <div class="vb disabled" title="只读不可用">✥</div>
      <div class="vb on" title="缩放">↕</div>
      <div class="vb on" title="平移">⌖</div>
      <div style="height:1px;background:var(--ant-color-border);margin:4px 0"></div>
      <div class="vb on">⊕</div>
      <div class="vb disabled" title="只读不可用">⊟</div>
      <div class="vb disabled" title="只读不可用">✎</div>
    </div>
    <div class="present-controls">
      <div class="pc-btn" title="上一节">‹</div>
      <div class="pc-sep"></div>
      <div class="pc-progress">2 / 8</div>
      <div class="pc-sep"></div>
      <div class="pc-btn primary" title="下一节">›</div>
    </div>
  </div>
  <div class="ft"><span style="color:#4096ff">⊟ 只读模式 · 由 林奇 分享 · 2026-07-15</span><span class="right">⌘C 复制节点 · ⌘D 复制到自己的工作区</span></div>
</div>
</body></html>
