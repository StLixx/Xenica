<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>系统状态 · 全局空态 · Xenica</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>*{box-sizing:border-box;margin:0;padding:0}html,body{background:#000;color:var(--ant-color-text);font-family:var(--ant-font-family);-webkit-font-smoothing:antialiased;min-height:100vh}.app{min-height:100vh;display:grid;grid-template-rows:36px 1fr 28px}.hd{background:var(--ant-color-bg-elevated);border-bottom:1px solid var(--ant-color-border);padding:0 16px;display:flex;align-items:center;gap:12px;font-size:12px}.hd .brand{font-weight:700;letter-spacing:.14em}.hd .brand .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ant-color-primary);box-shadow:0 0 6px var(--ant-color-primary);margin-right:8px;vertical-align:middle}.hd .right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--ant-color-text-tertiary)}.mid{background:var(--ant-color-bg-base);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background-image:linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);background-size:40px 40px}.mid::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#14b8a614 0%,transparent 60%)}.stage{text-align:center;max-width:680px;padding:48px;position:relative;z-index:1}.art{width:180px;height:180px;margin:0 auto 32px;position:relative;animation:bob 3s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}.art .r1{position:absolute;inset:0;border:1.5px solid var(--ant-color-primary);border-radius:50%;opacity:.3;animation:rp 12s linear infinite}@keyframes rp{to{transform:rotate(360deg)}}.art .r2{position:absolute;inset:18px;border:1.5px dashed var(--ant-color-primary);border-radius:50%;opacity:.4;animation:rp 8s linear infinite reverse}.art .r3{position:absolute;inset:36px;border:1.5px solid var(--ant-color-primary-text);border-radius:50%;opacity:.5;animation:rp 6s linear infinite}.art .glyph{position:absolute;inset:54px;background:linear-gradient(135deg,#14b8a6,#0d9488);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:48px;font-weight:600;box-shadow:0 16px 40px -8px #14b8a680}.art .dot{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--ant-color-primary);box-shadow:0 0 12px var(--ant-color-primary)}.art .d1{top:-5px;left:50%;animation:float 2s ease-in-out infinite}.art .d2{right:-5px;top:50%;animation:float 2s ease-in-out .5s infinite}.art .d3{bottom:-5px;left:50%;animation:float 2s ease-in-out 1s infinite}.art .d4{left:-5px;top:50%;animation:float 2s ease-in-out 1.5s infinite}@keyframes float{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(-12px);opacity:1}}.stage h1{font-size:36px;font-weight:600;letter-spacing:-.01em;color:var(--ant-color-text);margin-bottom:12px}.stage h1 em{font-style:normal;color:var(--ant-color-primary-text)}.stage>p{font-size:14px;color:var(--ant-color-text-secondary);line-height:1.7;margin-bottom:32px;max-width:520px;margin-left:auto;margin-right:auto}.ctas{display:flex;gap:8px;justify-content:center;margin-bottom:36px}.templates{padding-top:32px;border-top:1px solid var(--ant-color-border)}.templates h3{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ant-color-text-tertiary);font-family:ui-monospace,monospace;margin-bottom:16px;font-weight:600}.tpl-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.tpl{background:var(--ant-color-bg-container);border:1px solid var(--ant-color-border);border-radius:10px;padding:18px 14px;text-align:center;cursor:default;transition:all .15s}.tpl:hover{border-color:var(--ant-color-primary-border);background:var(--ant-color-bg-elevated);transform:translateY(-2px)}.tpl .ic{width:40px;height:40px;border-radius:10px;background:var(--ant-color-fill-secondary);color:var(--ant-color-primary-text);display:flex;align-items:center;justify-content:center;font-size:18px;margin:0 auto 10px}.tpl .nm{font-size:12px;font-weight:600;color:var(--ant-color-text);margin-bottom:2px}.tpl .ds{font-size:10px;color:var(--ant-color-text-tertiary);font-family:ui-monospace,monospace;letter-spacing:.06em}.ft{background:var(--ant-color-bg-elevated);border-top:1px solid var(--ant-color-border);padding:0 16px;display:flex;align-items:center;font-size:11px;color:var(--ant-color-text-secondary)}.ft .right{margin-left:auto;font-family:ui-monospace,monospace}</style></body>
<div class="app"><div class="hd"><div class="brand"><span class="dot"></span>XENICA</div><div style="color:var(--ant-color-text-tertiary)">· 首次启动 · 欢迎</div><div class="right"><span style="color:var(--ant-color-success)">● 0 节点</span><span style="color:var(--ant-color-text-tertiary)">⌘K</span><div class="av" style="width:22px;height:22px;font-size:10px">XL</div></div></div><div class="mid"><div class="stage"><div class="art"><div class="r1"></div><div class="r2"></div><div class="r3"></div><div class="glyph">⌬</div><div class="dot d1"></div><div class="dot d2"></div><div class="dot d3"></div><div class="dot d4"></div></div><h1>欢迎来到<em> Xenica</em></h1><p>这是你的空白工作区。Xenica 是一个以节点画布为核心的工作台——把笔记、引用、任务、灵感织成一张可生长的网。<br><br>从一个空白画布开始，或从模板快速搭建。</p><div class="ctas"><button class="btn btn-primary btn-lg">+ 新建空白画布</button><button class="btn btn-default btn-lg">⌘ 从模板开始</button><button class="btn btn-ghost btn-lg">⤒ 导入 Notion / Obsidian</button></div><div class="templates"><h3>— 推荐模板 —</h3><div class="tpl-grid"><div class="tpl"><div class="ic">▦</div><div class="nm">个人笔记</div><div class="ds">DAILY · JOURNAL</div></div><div class="tpl"><div class="ic">⌬</div><div class="nm">项目看板</div><div class="ds">KANBAN · TASKS</div></div><div class="tpl"><div class="ic">⌗</div><div class="nm">研究项目</div><div class="ds">RESEARCH · DOCS</div></div><div class="tpl"><div class="ic">▦</div><div class="nm">阅读清单</div><div class="ds">READING · LIST</div></div></div></div></div></div><div class="ft"><span>首次启动 · 选择模板或新建空白</span><span class="right">⌘N 新建 · ⌘⇧T 模板库</span></div></div>
</body></html>
