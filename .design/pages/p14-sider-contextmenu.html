<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>侧栏 · 右键菜单 · Xenica</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000;color:var(--ant-color-text);font-family:var(--ant-font-family);-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden}
  .app{height:100vh;display:grid;grid-template-columns:280px 1fr;grid-template-rows:36px 1fr 28px}
  .hd{grid-column:1/-1;background:var(--ant-color-bg-elevated);border-bottom:1px solid var(--ant-color-border);padding:0 16px;display:flex;align-items:center;gap:12px;font-size:12px}
  .hd .brand{font-weight:700;letter-spacing:.14em}
  .hd .brand .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ant-color-primary);box-shadow:0 0 6px var(--ant-color-primary);margin-right:8px;vertical-align:middle}
  .hd .right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--ant-color-text-tertiary)}
  .sb{background:var(--ant-color-bg-base);border-right:1px solid var(--ant-color-border);padding:10px 0;overflow:auto;font-size:13px}
  .sb-section{padding:10px 16px 6px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ant-color-text-tertiary);font-family:ui-monospace,monospace}
  .tn{display:flex;align-items:center;gap:8px;padding:6px 16px;font-size:12.5px;color:var(--ant-color-text-secondary);border-left:2px solid transparent;cursor:default}
  .tn:hover{background:var(--ant-color-fill-secondary);color:var(--ant-color-text)}
  .tn.on{background:var(--ant-color-primary-bg);color:var(--ant-color-primary-text);border-left-color:var(--ant-color-primary)}
  .tn.rightclicked{background:#14b8a614;border-left-color:var(--ant-color-primary);box-shadow:0 0 0 1px var(--ant-color-primary-border)}
  .tn .glyph{font-size:11px;opacity:.7}
  .tn .badge{margin-left:auto;font-size:10px;background:var(--ant-color-fill-tertiary);color:var(--ant-color-text-tertiary);padding:1px 6px;border-radius:8px}
  .mid{background:var(--ant-color-bg-layout);position:relative;overflow:hidden}
  .canvas-bg{position:absolute;inset:0;background-image:var(--xe-bg-grid);background-size:40px 40px;opacity:.4}
  .ctx{position:absolute;left:200px;top:80px;width:240px;background:var(--ant-color-bg-elevated);border:1px solid var(--ant-color-border);border-radius:10px;box-shadow:0 20px 60px -10px #000000c0;padding:6px;z-index:50}
  .ctx-item{display:flex;align-items:center;gap:12px;padding:7px 12px;font-size:13px;color:var(--ant-color-text-secondary);border-radius:6px;cursor:default}
  .ctx-item:hover{background:var(--ant-color-fill-secondary);color:var(--ant-color-text)}
  .ctx-item.danger{color:var(--ant-color-error)}
  .ctx-item.danger:hover{background:#dc444620}
  .ctx-item .ico{width:16px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ant-color-text-tertiary)}
  .ctx-item .kbd{margin-left:auto;font-family:ui-monospace,monospace;font-size:10px;color:var(--ant-color-text-tertiary)}
  .ctx-item .arrow{margin-left:auto;color:var(--ant-color-text-tertiary);font-size:10px}
  .ctx-div{height:1px;background:var(--ant-color-border);margin:4px 8px}
  .ctx-label{padding:8px 12px 4px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ant-color-text-tertiary);font-family:ui-monospace,monospace}
  .ft{grid-column:1/-1;background:var(--ant-color-bg-elevated);border-top:1px solid var(--ant-color-border);padding:0 16px;display:flex;align-items:center;font-size:11px;color:var(--ant-color-text-secondary)}
  .ft .right{margin-left:auto}
</style></head><body>
<div class="app">
  <div class="hd">
    <div class="brand"><span class="dot"></span>XENICA</div>
    <div style="color:var(--ant-color-text-tertiary)">· 工作区</div>
    <div class="right"><span>⌘K</span><div class="av" style="width:22px;height:22px;font-size:10px">XL</div></div>
  </div>
  <div class="sb">
    <div class="sb-section">收藏</div>
    <div class="tn on"><span class="glyph">◉</span>节点画布<span class="badge">128</span></div>
    <div class="tn"><span class="glyph">▤</span>研究项目<span class="badge">17</span></div>
    <div class="tn rightclicked"><span class="glyph">✎</span>每日日记<span class="badge">31</span></div>
    <div class="tn"><span class="glyph">▦</span>阅读清单<span class="badge">17</span></div>
    <div class="tn"><span class="glyph">⌬</span>项目看板<span class="badge">9</span></div>
    <div class="sb-section" style="margin-top:8px">私人</div>
    <div class="tn"><span class="glyph">✎</span>草稿<span class="badge">2</span></div>
    <div class="tn"><span class="glyph">⊟</span>归档<span class="badge">12</span></div>
  </div>
  <div class="mid">
    <div class="canvas-bg"></div>
    <div class="ctx">
      <div class="ctx-item"><span class="ico">+</span>新建子节点<span class="kbd">⌘N</span></div>
      <div class="ctx-item"><span class="ico">▦</span>新建数据库<span class="arrow">▸</span></div>
      <div class="ctx-div"></div>
      <div class="ctx-item"><span class="ico">✎</span>重命名<span class="kbd">F2</span></div>
      <div class="ctx-item"><span class="ico">⌖</span>设为根节点<span class="kbd">⌘⇧R</span></div>
      <div class="ctx-item"><span class="ico">⊕</span>添加到收藏<span class="kbd">⌘D</span></div>
      <div class="ctx-div"></div>
      <div class="ctx-item"><span class="ico">⤓</span>导出为 Markdown<span class="arrow">▸</span></div>
      <div class="ctx-item"><span class="ico">⇅</span>移动到…<span class="arrow">▸</span></div>
      <div class="ctx-item"><span class="ico">⧉</span>复制引用<span class="kbd">⌘⇧C</span></div>
      <div class="ctx-div"></div>
      <div class="ctx-item danger"><span class="ico">⊘</span>删除<span class="kbd">⌫</span></div>
    </div>
  </div>
  <div class="ft"><span>右键 · 每日日记</span><span class="right">ESC 关闭</span></div>
</div>
</body></html>
