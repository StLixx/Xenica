<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>命令面板 · 执行结果反馈 · Xenica</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>*{box-sizing:border-box;margin:0;padding:0}html,body{background:#000;color:var(--ant-color-text);font-family:var(--ant-font-family);-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden}.stage{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;padding-top:120px;background:rgba(0,0,0,.4);backdrop-filter:blur(8px)}.panel{width:640px;background:var(--ant-color-bg-elevated);border:1px solid var(--ant-color-border);border-radius:14px;box-shadow:0 40px 100px -20px #000000c0;overflow:hidden;animation:slideUp .2s ease-out}@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}.result{padding:32px;text-align:center;position:relative}.check-circle{width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,#14b8a6,#0d9488);display:flex;align-items:center;justify-content:center;color:#fff;font-size:42px;margin:0 auto 20px;box-shadow:0 16px 40px -8px #14b8a680;position:relative;animation:bob 2s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.check-circle::after{content:"";position:absolute;inset:-10px;border:2px solid #14b8a640;border-radius:50%;animation:ring 1.8s ease-out forwards}@keyframes ring{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.4);opacity:0}}.check-circle.fail{background:linear-gradient(135deg,#dc4446,#a8071a);box-shadow:0 16px 40px -8px #dc444680}.check-circle.fail::after{border-color:#dc444660}.result h2{font-size:22px;font-weight:600;color:var(--ant-color-text);margin-bottom:8px}.result>p{font-size:13px;color:var(--ant-color-text-secondary);line-height:1.6;margin-bottom:24px;max-width:480px;margin-left:auto;margin-right:auto}.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:24px}.info-cell{background:var(--ant-color-bg-base);border:1px solid var(--ant-color-border);border-radius:10px;padding:14px;text-align:left}.info-cell .k{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ant-color-text-tertiary);font-family:ui-monospace,monospace;margin-bottom:6px}.info-cell .v{font-size:14px;color:var(--ant-color-text);font-weight:500;display:flex;align-items:center;gap:6px}.info-cell .v.good{color:var(--ant-color-success)}.info-cell .v.warn{color:var(--ant-color-warning)}.actions{display:flex;gap:8px;justify-content:center}.actions .btn{display:flex;align-items:center;gap:6px}.next-actions{padding:18px 32px;background:var(--ant-color-bg-base);border-top:1px solid var(--ant-color-border);display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.next-actions .na{padding:6px 12px;background:var(--ant-color-bg-container);border:1px solid var(--ant-color-border);border-radius:6px;font-size:11px;color:var(--ant-color-text-secondary);cursor:default;font-family:ui-monospace,monospace;letter-spacing:.04em}.next-actions .na:hover{background:var(--ant-color-bg-elevated);color:var(--ant-color-text);border-color:var(--ant-color-primary-border)}.foot{padding:10px 24px;border-top:1px solid var(--ant-color-border);background:var(--ant-color-bg-container);font-size:11px;color:var(--ant-color-text-tertiary);font-family:ui-monospace,monospace;text-align:center;letter-spacing:.06em}</style></body>
<div class="stage"><div class="panel"><div class="result"><div class="check-circle">✓</div><h2>自动布局完成</h2><p>12 个节点已按连接关系重排。新位置基于 d3-force 算法，模拟 300 tick 后稳定收敛。</p><div class="info-grid"><div class="info-cell"><div class="k">节点数</div><div class="v good">12 / 12 重定位</div></div><div class="info-cell"><div class="k">用时</div><div class="v">340 ms</div></div><div class="info-cell"><div class="k">迭代</div><div class="v">300 tick</div></div><div class="info-cell"><div class="k">警告</div><div class="v warn">2 个重叠已解决</div></div></div><div class="actions"><button class="btn btn-default">⌘Z 撤销</button><button class="btn btn-default">⊟ 锁定布局</button><button class="btn btn-primary">↗ 居中查看</button></div></div><div class="next-actions"><div class="na">⊞ 配置参数</div><div class="na">⌘ 切换算法</div><div class="na">⤓ 导出图片</div><div class="na">⊕ 分享画布</div><div class="na">↻ 重新布局</div></div><div class="foot">按 ESC 关闭 · ⌘Z 撤销 · ↵ 确认</div></div></div>
</body></html>
