<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>引导 · 选择使用场景 · Xenica</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>*{box-sizing:border-box;margin:0;padding:0}html,body{background:#000;color:var(--ant-color-text);font-family:var(--ant-font-family);-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden}.stage{display:grid;grid-template-columns:1fr 1fr;height:100vh}.pane-left{background:linear-gradient(135deg,#0a2922,#000);padding:80px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--ant-color-border)}.brand{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--ant-color-primary-text);font-family:ui-monospace,monospace}.hero h1{font-size:56px;font-weight:600;line-height:1.05;letter-spacing:-.02em;margin-bottom:18px;margin-top:60px;color:var(--ant-color-text)}.hero h1 em{font-style:normal;color:var(--ant-color-primary-text)}.hero p{font-size:15px;line-height:1.6;color:var(--ant-color-text-secondary);max-width:480px}.step-bar{display:flex;gap:8px;align-items:center;margin-bottom:18px;font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.18em;color:var(--ant-color-text-tertiary)}.step-bar i{width:24px;height:2px;background:var(--ant-color-border);border-radius:2px}.step-bar i.done{background:var(--ant-color-primary)}.step-bar i.on{background:var(--ant-color-primary-text)}.pane-right{background:var(--ant-color-bg-base);padding:80px;display:flex;flex-direction:column;justify-content:center;overflow:auto}.pane-right h2{font-size:24px;margin-bottom:8px;color:var(--ant-color-text)}.pane-right p.sub{font-size:13px;color:var(--ant-color-text-secondary);margin-bottom:32px}.opt-list{display:flex;flex-direction:column;gap:12px;margin-bottom:32px}.opt{display:flex;align-items:center;gap:16px;padding:20px;border:1px solid var(--ant-color-border);border-radius:12px;background:var(--ant-color-bg-container);cursor:default;transition:all .15s}.opt:hover{border-color:var(--ant-color-primary-border);background:var(--ant-color-bg-elevated)}.opt.on{border-color:var(--ant-color-primary);background:var(--ant-color-primary-bg);box-shadow:0 0 0 1px var(--ant-color-primary)}.opt-icon{width:48px;height:48px;border-radius:10px;background:var(--ant-color-fill-secondary);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--ant-color-primary-text);flex:none}.opt.on .opt-icon{background:var(--ant-color-primary);color:#fff}.opt-info{flex:1}.opt-title{font-size:15px;font-weight:600;color:var(--ant-color-text);margin-bottom:4px}.opt-desc{font-size:12px;color:var(--ant-color-text-secondary);line-height:1.4}.opt-check{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--ant-color-border);display:flex;align-items:center;justify-content:center;color:transparent;font-size:11px}.opt.on .opt-check{background:var(--ant-color-primary);border-color:var(--ant-color-primary);color:#fff}</style></body>
<div class="stage"><div class="pane-left"><div class="brand">XENICA · ATRIUM · v5.0.0</div><div class="hero"><div class="step-bar"><i class="done"></i><i class="on"></i><i></i><i></i><span>第 2 / 4 步</span></div><h1>开始之前<br><em>选择你的使用场景</em></h1><p>Xenica 可以服务于多种场景。告诉我们你最常做的——我们据此推荐初始模板与节点视图布局。</p></div><div style="font-family:ui-monospace,monospace;font-size:11px;color:var(--ant-color-text-tertiary);letter-spacing:.18em">PRESS · ESC TO EXIT</div></div><div class="pane-right"><h2>你打算用 Xenica 主要做什么？</h2><p class="sub">选一个就好，后续可在设置中修改。</p><div class="opt-list"><div class="opt on"><div class="opt-icon">◐</div><div class="opt-info"><div class="opt-title">个人笔记</div><div class="opt-desc">日记 · 阅读清单 · 灵感捕捉 · 碎片想法</div></div><div class="opt-check">✓</div></div><div class="opt"><div class="opt-icon">⌬</div><div class="opt-info"><div class="opt-title">团队协作</div><div class="opt-desc">项目计划 · 会议纪要 · 文档共享 · 实时评论</div></div><div class="opt-check"></div></div><div class="opt"><div class="opt-icon">⌗</div><div class="opt-info"><div class="opt-title">学术研究</div><div class="opt-desc">文献管理 · 双链笔记 · 引用与脚注 · 文献综述</div></div><div class="opt-check"></div></div><div class="opt"><div class="opt-icon">⊞</div><div class="opt-info"><div class="opt-title">设计 / 工程</div><div class="opt-desc">需求文档 · ADR · 组件库 · 流程图</div></div><div class="opt-check"></div></div></div><div style="display:flex;justify-content:space-between"><button class="btn btn-ghost">← 上一步</button><div style="display:flex;gap:8px"><button class="btn btn-default">跳过</button><button class="btn btn-primary btn-lg">继续 →</button></div></div></div></div>
</body></html>
