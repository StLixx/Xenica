<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>引导 · 创建第一个节点 · Xenica</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>*{box-sizing:border-box;margin:0;padding:0}html,body{background:#000;color:var(--ant-color-text);font-family:var(--ant-font-family);-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden}.stage{display:grid;grid-template-columns:280px 1fr;height:100vh}.sb{background:var(--ant-color-bg-base);border-right:1px solid var(--ant-color-border);padding:14px 0;display:flex;flex-direction:column}.sb-head{padding:8px 16px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ant-color-text-tertiary);font-family:ui-monospace,monospace;font-weight:600}.mid{background:var(--ant-color-bg-layout);position:relative;overflow:hidden}.canvas-bg{position:absolute;inset:0;background-image:var(--xe-bg-grid);background-size:40px 40px;opacity:.5}.spotlight{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,transparent 180px,rgba(0,0,0,.75) 280px);pointer-events:none}.tooltip{position:absolute;left:50%;top:50%;transform:translate(-50%,60px);width:380px;background:var(--ant-color-bg-elevated);border:1px solid var(--ant-color-primary-border);border-radius:14px;padding:24px;box-shadow:0 20px 60px #00000080,0 0 30px -10px #14b8a660;z-index:50}.tooltip::before{content:"";position:absolute;top:-12px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:12px solid var(--ant-color-bg-elevated)}.tooltip .step{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.18em;color:var(--ant-color-primary-text);font-family:ui-monospace,monospace;text-transform:uppercase;margin-bottom:8px}.tooltip h3{font-size:18px;font-weight:600;color:var(--ant-color-text);margin-bottom:8px;line-height:1.3}.tooltip p{font-size:13px;color:var(--ant-color-text-secondary);line-height:1.6;margin-bottom:18px}.tooltip .actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.step-dots{display:flex;gap:5px}.step-dots i{width:6px;height:6px;border-radius:50%;background:var(--ant-color-fill-tertiary)}.step-dots i.on{background:var(--ant-color-primary);width:18px;border-radius:3px}.target-area{position:absolute;left:50%;top:50%;transform:translate(-50%,-30%);width:240px;height:120px;border:2px dashed var(--ant-color-primary);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--ant-color-primary-text);font-size:13px;font-family:ui-monospace,monospace;letter-spacing:.06em;animation:pulse 1.6s ease-in-out infinite;background:#14b8a608}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #14b8a640}50%{box-shadow:0 0 0 12px #14b8a600}}.kbd-hint{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);display:flex;gap:8px;font-size:12px;color:var(--ant-color-text-tertiary);background:var(--ant-color-bg-elevated);border:1px solid var(--ant-color-border);padding:8px 14px;border-radius:999px;font-family:ui-monospace,monospace}.kbd-hint .k{padding:2px 6px;background:var(--ant-color-fill-secondary);border-radius:3px;color:var(--ant-color-text-secondary)}</style></body>
<div class="stage"><div class="sb"><div class="sb-head">工作区</div><div style="padding:6px 16px;font-size:13px;color:var(--ant-color-text-secondary)">· 我的笔记</div><div style="padding:6px 16px;font-size:13px;color:var(--ant-color-text-secondary)">· 每日日记</div><div style="padding:6px 16px;font-size:13px;color:var(--ant-color-primary-text);background:var(--ant-color-primary-bg);border-left:2px solid var(--ant-color-primary)">· 新画布 ★</div></div><div class="mid"><div class="canvas-bg"></div><div class="spotlight"></div><div class="target-area">+ 双击此处新建</div><div class="tooltip"><div class="step">第 3 / 4 步 · TUTORIAL</div><h3>创建你的第一个节点</h3><p>节点是 Xenica 的基本单位——可以是一段文字、一个想法、一个引用、一个待办。<br><br>在画布的<b style="color:var(--ant-color-text)">任意位置双击</b>即可创建。或者按 <span style="padding:1px 6px;background:var(--ant-color-fill-secondary);border-radius:3px;font-family:ui-monospace,monospace">D</span> 键。</p><div class="actions"><div class="step-dots"><i></i><i></i><i class="on"></i><i></i></div><div style="display:flex;gap:8px"><button class="btn btn-ghost btn-sm">← 上一步</button><button class="btn btn-primary btn-sm">下一步 →</button></div></div><button class="btn btn-default" style="width:100%;justify-content:center">跳过引导 · 直接进入</button></div><div class="kbd-hint">双击 / 按 <span class="k">D</span> · ESC 退出引导</div></div></div>
</body></html>
