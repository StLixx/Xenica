<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>导出 · 进度 · Xenica</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>*{box-sizing:border-box;margin:0;padding:0}html,body{background:#000;color:var(--ant-color-text);font-family:var(--ant-font-family);-webkit-font-smoothing:antialiased;min-height:100vh}.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 50%,#14b8a608 0%,transparent 60%)}.modal{background:var(--ant-color-bg-elevated);border:1px solid var(--ant-color-border);border-radius:16px;width:560px;padding:40px 48px;box-shadow:0 40px 100px -20px #000000c0;text-align:center}.spin{width:72px;height:72px;border:3px solid var(--ant-color-fill-secondary);border-top-color:var(--ant-color-primary);border-radius:50%;margin:0 auto 20px;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.modal h2{font-size:20px;font-weight:600;color:var(--ant-color-text);margin-bottom:8px}.modal>p{font-size:13px;color:var(--ant-color-text-secondary);margin-bottom:24px}.ring{position:relative;width:160px;height:160px;margin:0 auto 24px}.ring svg{transform:rotate(-90deg)}.ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}.ring .pct .n{font-size:36px;font-weight:600;color:var(--ant-color-text);font-family:ui-monospace,monospace;line-height:1}.ring .pct .l{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ant-color-text-tertiary);font-family:ui-monospace,monospace;margin-top:4px}.stages{display:flex;flex-direction:column;gap:8px;margin-top:20px;text-align:left}.stage{display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--ant-color-bg-base);border:1px solid var(--ant-color-border);border-radius:6px;font-size:12px;color:var(--ant-color-text-secondary)}.stage .ic{width:16px;height:16px;border-radius:50%;background:var(--ant-color-fill-secondary);color:var(--ant-color-text-tertiary);display:flex;align-items:center;justify-content:center;font-size:10px;flex:none}.stage.done .ic{background:var(--ant-color-success);color:#fff}.stage.doing .ic{background:var(--ant-color-primary);color:#fff;animation:sp 1s linear infinite}.stage .nm{flex:1;color:var(--ant-color-text)}.stage.done .nm{color:var(--ant-color-success)}.stage.doing .nm{color:var(--ant-color-primary-text);font-weight:600}.stage .ti{font-family:ui-monospace,monospace;font-size:10px;color:var(--ant-color-text-tertiary)}</style></body>
<div class="stage"><div class="modal"><div class="ring"><svg width="160" height="160"><circle cx="80" cy="80" r="72" fill="none" stroke="#ffffff14" stroke-width="6"/><circle cx="80" cy="80" r="72" fill="none" stroke="#14b8a6" stroke-width="6" stroke-dasharray="452" stroke-dashoffset="113" stroke-linecap="round"/></svg><div class="pct"><div class="n">75%</div><div class="l">已完成</div></div></div><h2>正在导出工作区</h2><p>约 142 MB · 估算剩余 24 秒</p><div class="stages"><div class="stage done"><div class="ic">✓</div><div class="nm">序列化节点</div><span class="ti">2.4s</span></div><div class="stage done"><div class="ic">✓</div><div class="nm">序列化连接</div><span class="ti">1.8s</span></div><div class="stage doing"><div class="ic">↻</div><div class="nm">打包附件（图片 / 文件）</div><span class="ti">~18s</span></div><div class="stage"><div class="ic">·</div><div class="nm">压缩 zip</div></div><div class="stage"><div class="ic">·</div><div class="nm">写入目标位置</div></div></div></div></div>
</body></html>
