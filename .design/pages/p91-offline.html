<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>系统状态 · 离线态 · Xenica</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>*{box-sizing:border-box;margin:0;padding:0}html,body{background:#000;color:var(--ant-color-text);font-family:var(--ant-font-family);-webkit-font-smoothing:antialiased;min-height:100vh;overflow:hidden}.app{min-height:100vh;display:grid;grid-template-rows:36px 1fr 28px;filter:grayscale(.4) brightness(.6)}.hd{background:var(--ant-color-bg-elevated);border-bottom:1px solid var(--ant-color-border);padding:0 16px;display:flex;align-items:center;gap:12px;font-size:12px}.hd .brand{font-weight:700;letter-spacing:.14em}.hd .brand .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ant-color-text-tertiary);box-shadow:none;margin-right:8px;vertical-align:middle}.hd .right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--ant-color-text-tertiary)}.mid{background:var(--ant-color-bg-layout);position:relative;overflow:hidden}.canvas-bg{position:absolute;inset:0;background-image:var(--xe-bg-grid);background-size:40px 40px;opacity:.4}.node{position:absolute;background:var(--ant-color-bg-elevated);border:1px solid var(--ant-color-border);border-radius:10px;padding:12px 16px;min-width:160px;font-size:13px;box-shadow:0 4px 12px #00000060;opacity:.6}.node h4{font-size:13px;font-weight:600;margin-bottom:4px}.node .meta{font-size:10px;color:var(--ant-color-text-tertiary);font-family:ui-monospace,monospace}.ft{background:var(--ant-color-bg-elevated);border-top:1px solid var(--ant-color-border);padding:0 16px;display:flex;align-items:center;font-size:11px;color:var(--ant-color-text-secondary)}.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:40px;z-index:100}.card{width:560px;background:var(--ant-color-bg-elevated);border:1px solid var(--ant-color-warning);border-radius:16px;padding:36px 40px;box-shadow:0 40px 100px -20px #000000c0,0 0 60px -10px #d8961440;text-align:center;position:relative;overflow:hidden}.card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--ant-color-warning),transparent)}.ico-circle{width:72px;height:72px;border-radius:50%;background:#d8961420;color:var(--ant-color-warning);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 18px;position:relative;animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #d8961440}50%{box-shadow:0 0 0 14px #d8961400}}.ico-circle::before{content:"";position:absolute;inset:-12px;border:2px dashed #d8961460;border-radius:50%;animation:spin 8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.card h2{font-size:22px;font-weight:600;color:var(--ant-color-text);margin-bottom:8px}.card h2 em{font-style:normal;color:var(--ant-color-warning)}.card>p{font-size:13px;color:var(--ant-color-text-secondary);line-height:1.7;margin-bottom:18px}.diag{background:var(--ant-color-bg-base);border:1px solid var(--ant-color-border);border-radius:10px;padding:14px 18px;font-family:ui-monospace,monospace;font-size:11px;color:var(--ant-color-text-tertiary);margin-bottom:20px;text-align:left}.diag .row{display:flex;justify-content:space-between;padding:3px 0}.diag .row .v{color:var(--ant-color-warning)}.diag .row .v.good{color:var(--ant-color-success)}.info-strip{padding:10px 14px;background:var(--ant-color-primary-bg);border-radius:8px;font-size:11px;color:var(--ant-color-primary-text);margin-bottom:20px;display:flex;align-items:center;gap:10px;text-align:left;font-family:ui-monospace,monospace;letter-spacing:.04em}.ctas{display:flex;gap:8px;justify-content:center}</style></body>
<div class="app"><div class="hd"><div class="brand"><span class="dot"></span>XENICA</div><div style="color:var(--ant-color-text-tertiary)">· 离线模式</div><div class="right"><span style="color:var(--ant-color-warning)">⚠ 离线</span><span>5 分钟前断连</span><div class="av" style="width:22px;height:22px;font-size:10px">XL</div></div></div><div class="mid"><div class="canvas-bg"></div><div class="node" style="left:200px;top:200px"><h4>晨间笔记</h4><div class="meta">日记 · 离线</div></div><div class="node" style="left:400px;top:200px"><h4>设计原则 v3</h4><div class="meta">文档 · 离线</div></div><div class="node" style="left:280px;top:340px"><h4>Antd 6 调研</h4><div class="meta">文档 · 离线</div></div></div><div class="ft"><span style="color:var(--ant-color-warning)">⚠ 离线 · 所有改动仅保存在本地</span><span style="margin-left:auto">恢复后自动同步 · <b style="color:var(--ant-color-primary-text)">3 项</b> 待同步</span></div><div class="overlay"><div class="card"><div class="ico-circle">⚠</div><h2>已切换到<em>离线模式</em></h2><p>无法连接到云端服务器。你的所有改动会保留在本地，恢复连接后自动同步。</p><div class="diag"><div class="row"><span>网络</span><span class="v">断开 · 5 分钟前</span></div><div class="row"><span>上次同步</span><span class="v good">10:32</span></div><div class="row"><span>本地数据库</span><span class="v good">✓ 正常</span></div><div class="row"><span>待同步队列</span><span class="v">3 项变更</span></div><div class="row"><span>重试策略</span><span class="v">指数退避 · 下次 30s</span></div></div><div class="info-strip"><span>📋</span>提示：你仍然可以编辑所有节点 · 评论、协作、共享暂不可用</div><div class="ctas"><button class="btn btn-default">↻ 立即重试</button><button class="btn btn-primary">→ 继续离线工作</button></div></div></div></div>
</body></html>
