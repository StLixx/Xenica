<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>侧栏 · 搜索高亮态 · Xenica</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000;color:var(--ant-color-text);font-family:var(--ant-font-family);-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden}
  .app{height:100vh;display:grid;grid-template-columns:300px 1fr;grid-template-rows:36px 1fr 28px}
  .hd{grid-column:1/-1;background:var(--ant-color-bg-elevated);border-bottom:1px solid var(--ant-color-border);padding:0 16px;display:flex;align-items:center;gap:12px;font-size:12px}
  .hd .brand{font-weight:700;letter-spacing:.14em}
  .hd .brand .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ant-color-primary);box-shadow:0 0 6px var(--ant-color-primary);margin-right:8px;vertical-align:middle}
  .hd .right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--ant-color-text-tertiary)}
  .sb{background:var(--ant-color-bg-base);border-right:1px solid var(--ant-color-border);padding:10px 0;overflow:auto;font-size:13px}
  .sb-search{margin:8px 12px;padding:8px 12px;background:var(--ant-color-bg-container);border:1px solid var(--ant-color-primary);border-radius:6px;font-size:12px;color:var(--ant-color-text);display:flex;align-items:center;gap:8px;box-shadow:0 0 0 2px var(--ant-color-primary-bg)}
  .sb-search input{flex:1;background:transparent;border:none;outline:none;color:var(--ant-color-text);font-size:12.5px;font-family:inherit}
  .sb-search .esc{font-size:10px;color:var(--ant-color-text-tertiary);background:var(--ant-color-fill-secondary);padding:2px 5px;border-radius:3px;font-family:ui-monospace,monospace;cursor:default}
  .cursor{display:inline-block;width:1.5px;height:14px;background:var(--ant-color-primary);vertical-align:-1px;animation:blink 1s infinite;margin-left:-2px}
  @keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
  .sb-section{padding:12px 16px 6px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ant-color-text-tertiary);font-family:ui-monospace,monospace;display:flex;align-items:center;gap:6px}
  .mark{background:#14b8a630;color:var(--ant-color-primary-text);padding:0 2px;border-radius:2px;font-weight:600}
  .tn{display:flex;align-items:center;gap:8px;padding:6px 16px;font-size:12.5px;color:var(--ant-color-text-secondary);cursor:default;border-left:2px solid transparent}
  .tn:hover{background:var(--ant-color-fill-secondary);color:var(--ant-color-text)}
  .tn.on{background:var(--ant-color-primary-bg);color:var(--ant-color-primary-text);border-left-color:var(--ant-color-primary)}
  .tn .glyph{font-size:11px;opacity:.7}
  .tn .badge{margin-left:auto;font-size:10px;background:var(--ant-color-fill-tertiary);color:var(--ant-color-text-tertiary);padding:1px 6px;border-radius:8px}
  .empty{padding:30px 20px;text-align:center;color:var(--ant-color-text-tertiary);font-size:12px}
  .summary{padding:8px 16px;background:var(--ant-color-bg-base);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ant-color-text-tertiary);font-family:ui-monospace,monospace;border-top:1px solid var(--ant-color-border);border-bottom:1px solid var(--ant-color-border);display:flex;justify-content:space-between}
  .mid{background:var(--ant-color-bg-layout);position:relative;overflow:hidden}
  .canvas-bg{position:absolute;inset:0;background-image:var(--xe-bg-grid);background-size:40px 40px;opacity:.4}
  .results-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--ant-color-text-tertiary)}
  .results-overlay .big{font-size:64px;color:var(--ant-color-primary);opacity:.25;font-weight:100;font-family:ui-monospace,monospace}
  .results-overlay .q{font-size:13px;color:var(--ant-color-text-secondary)}
  .results-overlay .q b{color:var(--ant-color-primary-text)}
  .ft{grid-column:1/-1;background:var(--ant-color-bg-elevated);border-top:1px solid var(--ant-color-border);padding:0 16px;display:flex;align-items:center;font-size:11px;color:var(--ant-color-text-secondary)}
  .ft .right{margin-left:auto}
</style></head><body>
<div class="app">
  <div class="hd">
    <div class="brand"><span class="dot"></span>XENICA</div>
    <div style="color:var(--ant-color-text-tertiary)">· 搜索</div>
    <div class="right"><span>⌘K</span><div class="av" style="width:22px;height:22px;font-size:10px">XL</div></div>
  </div>
  <div class="sb">
    <div class="sb-search">⌕<input value="设计"/><span class="cursor"></span><span class="esc">ESC</span></div>
    <div class="sb-section"><span>节点 · 6 项</span></div>
    <div class="tn"><span class="glyph">▤</span><span><span class="mark">设计</span>原则 v3</span><span class="badge">12:30</span></div>
    <div class="tn on"><span class="glyph">✎</span><span>晨间笔记：UI <span class="mark">设计</span>思路</span><span class="badge">07-15</span></div>
    <div class="tn"><span class="glyph">▦</span><span><span class="mark">设计</span>原则历史归档</span></div>
    <div class="sb-section"><span>数据库 · 2 项</span></div>
    <div class="tn"><span class="glyph">▦</span><span><span class="mark">设计</span>资源库</span><span class="badge">34</span></div>
    <div class="tn"><span class="glyph">▦</span><span>动效<span class="mark">设计</span>参考</span><span class="badge">12</span></div>
    <div class="sb-section"><span>设置 · 1 项</span></div>
    <div class="tn"><span class="glyph">⚙</span><span>外观：<span class="mark">设计</span> token</span></div>
    <div class="sb-section"><span>文档 · 2 项</span></div>
    <div class="tn"><span class="glyph">▤</span><span><span class="mark">设计</span>原则 ADR-003</span></div>
    <div class="tn"><span class="glyph">▤</span><span><span class="mark">设计</span>系统对照表</span></div>
    <div class="summary"><span>共 11 项匹配</span><span>用时 0.02s</span></div>
  </div>
  <div class="mid">
    <div class="canvas-bg"></div>
    <div class="results-overlay">
      <div class="big">11</div>
      <div class="q">搜索 "<b>设计</b>" · 共 11 项结果</div>
      <div style="font-size:11px;color:var(--ant-color-text-quaternary)">↑↓ 浏览 · ↵ 跳转 · ESC 关闭</div>
    </div>
  </div>
  <div class="ft"><span>搜索 · 设计</span><span class="right">11 结果 · 0.02s</span></div>
</div>
</body></html>
