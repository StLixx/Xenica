<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>画布 · 缩放与平移 · Xenica</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000;color:var(--ant-color-text);font-family:var(--ant-font-family);-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden}
  .app{height:100vh;display:grid;grid-template-rows:36px 1fr 28px}
  .hd{background:var(--ant-color-bg-elevated);border-bottom:1px solid var(--ant-color-border);padding:0 16px;display:flex;align-items:center;gap:12px;font-size:12px}
  .hd .brand{font-weight:700;letter-spacing:.14em}
  .hd .brand .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ant-color-primary);box-shadow:0 0 6px var(--ant-color-primary);margin-right:8px;vertical-align:middle}
  .hd .right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--ant-color-text-tertiary)}
  .mid{background:var(--ant-color-bg-layout);position:relative;overflow:hidden}
  .canvas-bg{position:absolute;inset:0;background-image:var(--xe-bg-grid);background-size:40px 40px;opacity:.4}
  .zoom-stage{position:absolute;inset:0;transform-origin:0 0;transform:scale(0.42) translate(-200px,-100px)}
  .node{position:absolute;background:var(--ant-color-bg-elevated);border:1px solid var(--ant-color-border);border-radius:10px;padding:12px 16px;min-width:160px;font-size:13px;box-shadow:0 4px 12px #00000060}
  .node h4{font-size:13px;font-weight:600;margin-bottom:4px}
  .node .meta{font-size:10px;color:var(--ant-color-text-tertiary);font-family:ui-monospace,monospace}
  .node.selected{border-color:var(--ant-color-primary);box-shadow:0 0 0 2px var(--ant-color-primary-bg),0 8px 24px #00000080}
  .zoom-ctrl{position:absolute;left:14px;bottom:14px;background:var(--ant-color-bg-elevated);border:1px solid var(--ant-color-border);border-radius:8px;padding:6px;display:flex;align-items:center;gap:6px;box-shadow:0 8px 24px #00000080}
  .z-btn{width:28px;height:28px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--ant-color-text-secondary);font-size:14px;font-weight:600}
  .z-btn:hover{background:var(--ant-color-fill-secondary)}
  .z-div{width:1px;height:18px;background:var(--ant-color-border)}
  .z-val{font-family:ui-monospace,monospace;font-size:12px;color:var(--ant-color-text);min-width:48px;text-align:center;padding:0 8px;border-radius:5px;background:var(--ant-color-fill-secondary);height:28px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
  .scale-bar{position:absolute;left:14px;bottom:60px;background:var(--ant-color-bg-elevated);border:1px solid var(--ant-color-border);border-radius:6px;padding:6px 10px;display:flex;align-items:center;gap:10px;font-size:10px;color:var(--ant-color-text-tertiary);font-family:ui-monospace,monospace;box-shadow:0 8px 24px #00000080}
  .scale-bar .bar{width:80px;height:2px;background:var(--ant-color-primary);border-radius:1px}
  .scale-bar .markers{display:flex;justify-content:space-between;width:80px;font-size:9px;color:var(--ant-color-text-quaternary)}
  .scale-bar .markers span:nth-child(2){margin-left:auto}
  .minimap{position:absolute;right:14px;bottom:14px;width:240px;height:160px;background:var(--ant-color-bg-elevated);border:1px solid var(--ant-color-border);border-radius:8px;padding:10px;box-shadow:0 8px 24px #00000080}
  .mm-title{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ant-color-text-tertiary);margin-bottom:8px;display:flex;justify-content:space-between}
  .mm-title .live{color:var(--ant-color-success);display:flex;align-items:center;gap:4px}
  .live::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--ant-color-success);box-shadow:0 0 6px var(--ant-color-success);animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .mm-inner{position:relative;width:100%;height:120px;background:#0a0a0a;border-radius:4px;overflow:hidden}
  .mm-node{position:absolute;border-radius:1px}
  .mm-viewport{position:absolute;border:1.5px solid var(--ant-color-primary-text);background:#14b8a615;cursor:move}
  .ft{background:var(--ant-color-bg-elevated);border-top:1px solid var(--ant-color-border);padding:0 16px;display:flex;align-items:center;font-size:11px;color:var(--ant-color-text-secondary)}
  .ft .right{margin-left:auto;display:flex;gap:10px}
</style></head><body>
<div class="app">
  <div class="hd">
    <div class="brand"><span class="dot"></span>XENICA</div>
    <div class="crumbs">· 工作区 · <b>节点画布</b> · 缩放 42%</div>
    <div class="right"><span style="color:var(--ant-color-success)">● 已同步</span><span>⌘K</span><div class="av" style="width:22px;height:22px;font-size:10px">XL</div></div>
  </div>
  <div class="mid">
    <div class="canvas-bg"></div>
    <div class="zoom-stage">
      <svg style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none">
        <path d="M 280 280 Q 380 220 480 280" class="edge"/>
        <path d="M 280 280 Q 220 380 240 480" class="edge"/>
        <path d="M 480 280 Q 580 340 620 460" class="edge"/>
        <path d="M 240 480 Q 340 540 480 480" class="edge"/>
      </svg>
      <div class="node" style="left:200px;top:240px"><h4>晨间笔记</h4><div class="meta">日记</div></div>
      <div class="node selected" style="left:400px;top:240px"><h4>设计原则 v3</h4><div class="meta">核心</div></div>
      <div class="node" style="left:540px;top:420px"><h4>Antd 6 调研</h4><div class="meta">文档</div></div>
      <div class="node" style="left:160px;top:440px"><h4>本月 OKR</h4><div class="meta">OKR</div></div>
    </div>
    <div class="zoom-ctrl">
      <div class="z-btn">−</div>
      <div class="z-div"></div>
      <div class="z-val">42%</div>
      <div class="z-div"></div>
      <div class="z-btn">+</div>
      <div class="z-div"></div>
      <div class="z-btn">⌖</div>
      <div class="z-btn">⤢</div>
    </div>
    <div class="scale-bar">
      <div class="bar"></div>
      <div class="markers"><span>0</span><span>50px</span></div>
    </div>
    <div class="minimap">
      <div class="mm-title"><span>缩略图 · 1:200</span><span class="live">LIVE</span></div>
      <div class="mm-inner">
        <div class="mm-node" style="left:20%;top:25%;width:14%;height:5%;background:var(--xe-node-default)"></div>
        <div class="mm-node" style="left:36%;top:25%;width:14%;height:5%;background:var(--xe-node-yellow);box-shadow:0 0 6px var(--xe-node-yellow)"></div>
        <div class="mm-node" style="left:52%;top:45%;width:14%;height:5%;background:var(--xe-node-purple)"></div>
        <div class="mm-node" style="left:18%;top:45%;width:14%;height:5%;background:var(--xe-node-green)"></div>
        <div class="mm-viewport" style="left:14%;top:18%;width:62%;height:60%"></div>
      </div>
    </div>
  </div>
  <div class="ft">
    <span>缩放 42%</span>
    <span>·</span>
    <span>平移 (-200, -100)</span>
    <span>·</span>
    <span>12 节点可见</span>
    <span class="right">
      <span>⌘+ 放大</span>
      <span>·</span>
      <span>⌘− 缩小</span>
      <span>·</span>
      <span>⌘0 适配窗口</span>
    </span>
  </div>
</div>
</body></html>
