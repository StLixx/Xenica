<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>搜索 · 无结果空态 · Xenica</title>

<style>*{box-sizing:border-box;margin:0;padding:0}html,body{background:#000;color:var(--ant-color-text);font-family:var(--ant-font-family);-webkit-font-smoothing:antialiased;min-height:100vh}.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px;background:radial-gradient(circle at 50% 50%,#14b8a608 0%,transparent 60%)}.panel{width:680px;background:var(--ant-color-bg-elevated);border:1px solid var(--ant-color-border);border-radius:16px;padding:48px;box-shadow:0 40px 100px -20px #00000080;text-align:center;position:relative;overflow:hidden}.search-bar{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--ant-color-bg-container);border:1px solid var(--ant-color-border);border-radius:12px;margin-bottom:32px}.search-bar .ic{font-size:20px;color:var(--ant-color-text-tertiary)}.search-bar input{flex:1;background:transparent;border:none;outline:none;color:var(--ant-color-text);font-size:16px;font-family:inherit;text-align:left}.search-bar .x{padding:4px 8px;background:var(--ant-color-fill-secondary);border-radius:4px;font-size:11px;color:var(--ant-color-text-tertiary);font-family:ui-monospace,monospace}.empty-art{width:140px;height:140px;margin:0 auto 24px;position:relative}.empty-art .ring{position:absolute;inset:0;border:2px dashed var(--ant-color-border);border-radius:50%}.empty-art .ring.inner{inset:18px;border-style:solid;border-color:var(--ant-color-border-secondary)}.empty-art .magnifier{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:56px;color:var(--ant-color-text-tertiary);opacity:.4}.empty-art .dot{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--ant-color-primary);box-shadow:0 0 10px var(--ant-color-primary);animation:fl 2s ease-in-out infinite}.empty-art .d1{top:8px;left:50%;animation-delay:0s}.empty-art .d2{right:8px;top:50%;animation-delay:.5s}.empty-art .d3{bottom:8px;left:50%;animation-delay:1s}.empty-art .d4{left:8px;top:50%;animation-delay:1.5s}@keyframes fl{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:1;transform:scale(1.4)}}.panel h2{font-size:24px;font-weight:600;color:var(--ant-color-text);margin-bottom:10px}.panel>p{font-size:13px;color:var(--ant-color-text-secondary);line-height:1.7;margin-bottom:24px}.suggestions{padding:20px;background:var(--ant-color-bg-base);border:1px solid var(--ant-color-border);border-radius:12px;text-align:left;margin-bottom:24px}.suggestions h4{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ant-color-text-tertiary);font-family:ui-monospace,monospace;margin-bottom:12px;font-weight:600}.sug-list{display:flex;flex-direction:column;gap:8px}.sug{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--ant-color-bg-container);border:1px solid var(--ant-color-border);border-radius:8px;font-size:13px;color:var(--ant-color-text-secondary);cursor:default}.sug:hover{background:var(--ant-color-bg-elevated);color:var(--ant-color-text);border-color:var(--ant-color-primary-border)}.sug .q{color:var(--ant-color-primary-text);font-family:ui-monospace,monospace;font-size:12px;background:var(--ant-color-primary-bg);padding:1px 6px;border-radius:3px;flex:none}.sug .ttl{flex:1}.sug .c{margin-left:auto;font-family:ui-monospace,monospace;font-size:11px;color:var(--ant-color-text-tertiary)}.tips{font-size:11px;color:var(--ant-color-text-tertiary);font-family:ui-monospace,monospace;letter-spacing:.06em;line-height:1.7}.tips b{color:var(--ant-color-primary-text)}</style></body>
<div class="stage"><div class="panel"><div class="search-bar"><span class="ic">⌕</span><input value="asdfgh" readonly/><span class="x">×</span></div><div class="empty-art"><div class="ring"></div><div class="ring inner"></div><div class="magnifier">⌕</div><div class="dot d1"></div><div class="dot d2"></div><div class="dot d3"></div><div class="dot d4"></div></div><h2>没有找到匹配结果</h2><p>「<b style="color:var(--ant-color-text);font-family:ui-monospace,monospace">asdfgh</b>」没有匹配任何节点、数据库或设置。试试以下建议：</p><div class="suggestions"><h4>— 你可能想搜 —</h4><div class="sug-list"><div class="sug"><span class="q">Antd</span><span class="ttl">Antd 6 调研笔记</span><span class="c">5 项</span></div><div class="sug"><span class="q">自动布局</span><span class="ttl">节点布局策略 v2</span><span class="c">8 项</span></div><div class="sug"><span class="q">设计原则</span><span class="ttl">设计原则 v3</span><span class="c">12 项</span></div><div class="sug"><span class="q">Notion 导入</span><span class="ttl">导入边界用例</span><span class="c">3 项</span></div></div></div><div class="tips"><b>TIPS · </b>检查拼写 · 缩短关键词 · 切换模糊匹配 · 启用 AI 同义词</div></div></div>
</body></html>
