<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>系统状态 · 全局加载 · Skeleton · Xenica</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>*{box-sizing:border-box;margin:0;padding:0}html,body{background:#000;color:var(--ant-color-text);font-family:var(--ant-font-family);-webkit-font-smoothing:antialiased;min-height:100vh}.app{min-height:100vh;display:grid;grid-template-rows:36px 1fr 28px}.hd{background:var(--ant-color-bg-elevated);border-bottom:1px solid var(--ant-color-border);padding:0 16px;display:flex;align-items:center;gap:12px;font-size:12px}.hd .brand{font-weight:700;letter-spacing:.14em}.hd .brand .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ant-color-primary);box-shadow:0 0 6px var(--ant-color-primary);margin-right:8px;vertical-align:middle}.hd .right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--ant-color-text-tertiary)}.mid{background:var(--ant-color-bg-base);padding:48px;display:grid;grid-template-columns:1fr 1fr;gap:48px;overflow:hidden}.col{display:flex;flex-direction:column;gap:24px}.col-title{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ant-color-text-tertiary);font-family:ui-monospace,monospace;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:8px}.col-title::after{content:"";flex:1;height:1px;background:var(--ant-color-border)}.skel-block{background:var(--ant-color-bg-container);border:1px solid var(--ant-color-border);border-radius:12px;padding:24px;position:relative;overflow:hidden}.skel{background:linear-gradient(90deg,var(--ant-color-fill-secondary) 0%,var(--ant-color-fill-tertiary) 50%,var(--ant-color-fill-secondary) 100%);background-size:200% 100%;animation:shimmer 1.6s ease-in-out infinite;border-radius:6px;color:transparent}@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}.skel.h1{height:24px;width:60%;margin-bottom:12px}.skel.h2{height:14px;width:80%;margin-bottom:8px}.skel.line{height:10px;margin-bottom:6px}.skel.line.short{width:40%}.skel.line.mid{width:60%}.skel.line.full{width:100%}.skel.avatar{width:48px;height:48px;border-radius:50%;margin-bottom:12px}.skel.row{display:flex;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ant-color-border-secondary)}.skel-row:last-child{border-bottom:0}.skel-row .av{width:32px;height:32px;border-radius:50%;flex:none}.skel-row .lines{flex:1}.skel-row .lines .skel{height:10px;margin-bottom:4px}.skel-row .lines .skel:last-child{margin-bottom:0}.skel-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.skel-card{padding:18px;background:var(--ant-color-bg-container);border:1px solid var(--ant-color-border);border-radius:12px;text-align:center}.skel-card .big{height:32px;width:60%;margin:0 auto 8px;border-radius:6px}.skel-card .lbl{height:10px;width:80%;margin:0 auto}.skel-canvas{height:300px;background:var(--ant-color-bg-container);border:1px solid var(--ant-color-border);border-radius:12px;position:relative;overflow:hidden}.skel-canvas::after{content:"正在加载画布...";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:13px;color:var(--ant-color-text-tertiary);font-family:ui-monospace,monospace;letter-spacing:.06em;z-index:1}.ft{background:var(--ant-color-bg-elevated);border-top:1px solid var(--ant-color-border);padding:0 16px;display:flex;align-items:center;font-size:11px;color:var(--ant-color-text-secondary)}.ft .right{margin-left:auto;font-family:ui-monospace,monospace}</style></body>
<div class="app"><div class="hd"><div class="brand"><span class="dot"></span>XENICA</div><div style="color:var(--ant-color-text-tertiary)">· 加载中 · 节点画布</div><div class="right"><span style="color:var(--ant-color-warning)">● 正在加载</span><span>~ 0.6s</span><div class="av" style="width:22px;height:22px;font-size:10px">XL</div></div></div><div class="mid"><div class="col"><div class="col-title">工作区</div><div class="skel-block"><div class="skel h1"></div><div class="skel line full"></div><div class="skel line mid"></div><div class="skel line short"></div><div style="margin-top:18px"><div class="skel-row"><div class="skel av skel"></div><div class="lines"><div class="skel line mid"></div><div class="skel line short"></div></div></div><div class="skel-row"><div class="skel av skel"></div><div class="lines"><div class="skel line mid"></div><div class="skel line short"></div></div></div><div class="skel-row"><div class="skel av skel"></div><div class="lines"><div class="skel line mid"></div><div class="skel line short"></div></div></div></div></div></div><div class="col"><div class="col-title">画布</div><div class="skel-canvas"><div class="skel h1" style="position:absolute;left:80px;top:80px;width:140px"></div><div class="skel" style="position:absolute;left:280px;top:80px;width:160px;height:60px;border-radius:10px"></div><div class="skel" style="position:absolute;left:520px;top:140px;width:180px;height:60px;border-radius:10px"></div><div class="skel" style="position:absolute;left:140px;top:200px;width:120px;height:50px;border-radius:10px"></div></div><div class="col-title" style="margin-top:14px">统计</div><div class="skel-cards"><div class="skel-card"><div class="skel big"></div><div class="skel lbl"></div></div><div class="skel-card"><div class="skel big"></div><div class="skel lbl"></div></div><div class="skel-card"><div class="skel big"></div><div class="skel lbl"></div></div></div></div></div><div class="ft"><span>加载中 · 节点画布 · 工作区「研究项目」</span><span class="right">节点 1,247 · 连接 3,891 · ≈ 0.6s</span></div></div>
</body></html>
