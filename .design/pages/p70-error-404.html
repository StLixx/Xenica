<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>错误状态 · 404 / 500 · Xenica</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>*{box-sizing:border-box;margin:0;padding:0}html,body{background:#000;color:var(--ant-color-text);font-family:var(--ant-font-family);-webkit-font-smoothing:antialiased;min-height:100vh}.stage{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.pane-art{background:linear-gradient(135deg,#0a2922,#000);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;border-right:1px solid var(--ant-color-border)}.art{position:relative;width:480px;height:360px}.glyph{position:absolute;font-size:200px;font-weight:200;color:var(--ant-color-primary);opacity:.15;line-height:1;letter-spacing:-.04em;font-family:'JetBrains Mono',ui-monospace,monospace;animation:float 6s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}.glyph-2{font-size:80px;color:var(--ant-color-warning);opacity:.6;top:60px;right:60px;animation:spin 8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.error-code{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:144px;font-weight:100;color:var(--ant-color-primary-text);font-family:'JetBrains Mono',ui-monospace,monospace;line-height:1;letter-spacing:-.04em;opacity:.9;text-shadow:0 0 60px rgba(20,184,166,.4)}.subtitle{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--ant-color-text-tertiary);font-family:ui-monospace,monospace;white-space:nowrap}.pane-msg{padding:80px;display:flex;flex-direction:column;justify-content:center}.eyebrow{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ant-color-warning);margin-bottom:14px;display:flex;align-items:center;gap:10px}.eyebrow .d{width:24px;height:1px;background:var(--ant-color-warning);opacity:.7}.pane-msg h1{font-size:42px;font-weight:600;line-height:1.1;letter-spacing:-.01em;margin-bottom:14px;color:var(--ant-color-text)}.pane-msg h1 em{font-style:normal;color:var(--ant-color-warning)}.pane-msg>p{font-size:14px;color:var(--ant-color-text-secondary);line-height:1.7;margin-bottom:24px;max-width:480px}.diag{background:var(--ant-color-bg-container);border:1px solid var(--ant-color-border);border-radius:12px;padding:18px 22px;margin-bottom:24px;font-family:ui-monospace,monospace;font-size:12px;color:var(--ant-color-text-tertiary);max-width:480px}.diag .row{display:flex;justify-content:space-between;padding:4px 0}.diag .row .k{color:var(--ant-color-text-quaternary)}.diag .row .v{color:var(--ant-color-text-secondary)}.diag .row .v.err{color:var(--ant-color-warning)}.ctas{display:flex;gap:8px;margin-bottom:24px}.suggestions{padding-top:24px;border-top:1px solid var(--ant-color-border);max-width:480px}.suggestions h4{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ant-color-text-tertiary);font-family:ui-monospace,monospace;margin-bottom:14px;font-weight:600}.suggestions-list{display:flex;flex-direction:column;gap:8px}.sug{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--ant-color-bg-container);border:1px solid var(--ant-color-border);border-radius:8px;font-size:13px;color:var(--ant-color-text-secondary);cursor:default;transition:all .15s}.sug:hover{border-color:var(--ant-color-primary-border);background:var(--ant-color-bg-elevated);color:var(--ant-color-text)}.sug .arr{margin-left:auto;color:var(--ant-color-text-quaternary);font-size:14px}</style></body>
<div class="stage"><div class="pane-art"><div class="art"><div class="glyph">⌬</div><div class="glyph glyph-2">⚠</div><div class="error-code">404</div><div class="subtitle">PAGE NOT FOUND</div></div></div><div class="pane-msg"><div class="eyebrow"><span class="d"></span>ERROR · 错误状态</div><h1>这里<em>没有画布</em>。</h1><p>你访问的页面已被移动、删除，或从未存在。Xenica 的节点画布是动态生成的——也许它在等待你创建。</p><div class="diag"><div class="row"><span class="k">REQUEST</span><span class="v err">GET /workspace/ancient-research/old-notes</span></div><div class="row"><span class="k">STATUS</span><span class="v err">404 Not Found</span></div><div class="row"><span class="k">REF</span><span class="v">err-7a9c-2b4f-2026-07-17</span></div><div class="row"><span class="k">TIME</span><span class="v">2026-07-17 10:42:18 UTC+8</span></div></div><div class="ctas"><button class="btn btn-primary btn-lg">← 返回工作区</button><button class="btn btn-default btn-lg">⌘ 搜索节点</button></div><div class="suggestions"><h4>— 你可以试试 —</h4><div class="suggestions-list"><div class="sug"><span style="color:var(--ant-color-primary-text)">▦</span>打开最近的工作区「节点画布」<span class="arr">→</span></div><div class="sug"><span style="color:var(--ant-color-primary-text)">⌕</span>使用 ⌘K 全局搜索<span class="arr">→</span></div><div class="sug"><span style="color:var(--ant-color-primary-text)">+</span>新建一个空白画布<span class="arr">→</span></div><div class="sug"><span style="color:var(--ant-color-primary-text)">▤</span>查看帮助文档<span class="arr">→</span></div></div></div></div></div>
</body></html>
