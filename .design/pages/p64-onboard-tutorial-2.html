<style>*{box-sizing:border-box;margin:0;padding:0}html,body{background:#000;color:var(--ant-color-text);font-family:var(--ant-font-family);-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden}.stage{display:grid;grid-template-columns:280px 1fr;height:100vh}.sb{background:var(--ant-color-bg-base);border-right:1px solid var(--ant-color-border);padding:14px 0}.sb-head{padding:8px 16px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ant-color-text-tertiary);font-family:ui-monospace,monospace;font-weight:600}.mid{background:var(--ant-color-bg-layout);position:relative;overflow:hidden}.canvas-bg{position:absolute;inset:0;background-image:var(--xe-bg-grid);background-size:40px 40px;opacity:.5}.node{position:absolute;background:var(--ant-color-bg-elevated);border:1px solid var(--ant-color-border);border-radius:10px;padding:12px 16px;min-width:160px;font-size:13px;box-shadow:0 4px 12px #00000060}.node h4{font-size:13px;font-weight:600;margin-bottom:4px}.node .meta{font-size:10px;color:var(--ant-color-text-tertiary);font-family:ui-monospace,monospace}.node.glow{border-color:var(--ant-color-primary);box-shadow:0 0 0 3px var(--ant-color-primary-bg),0 0 30px -5px #14b8a660;animation:glow 1.6s ease-in-out infinite}@keyframes glow{0%,100%{box-shadow:0 0 0 3px var(--ant-color-primary-bg),0 0 30px -5px #14b8a660}50%{box-shadow:0 0 0 5px var(--ant-color-primary-bg),0 0 40px -5px #14b8a680}}.port{position:absolute;right:-6px;top:50%;transform:translateY(-50%);width:12px;height:12px;border-radius:50%;background:var(--ant-color-primary);box-shadow:0 0 12px var(--ant-color-primary);animation:portPulse 1.2s ease-in-out infinite}@keyframes portPulse{0%,100%{transform:translateY(-50%) scale(1)}50%{transform:translateY(-50%) scale(1.3)}}.edge-preview{position:absolute;left:380px;top:236px;width:200px;height:1px;background:repeating-linear-gradient(90deg,var(--ant-color-primary) 0,var(--ant-color-primary) 6px,transparent 6px,transparent 10px);transform-origin:left;animation:dashFlow 1s linear infinite}@keyframes dashFlow{to{background-position:-16px 0}}.spotlight{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,transparent 200px,rgba(0,0,0,.7) 320px);pointer-events:none}.tooltip{position:absolute;right:32px;top:50%;transform:translateY(-50%);width:360px;background:var(--ant-color-bg-elevated);border:1px solid var(--ant-color-primary-border);border-radius:14px;padding:24px;box-shadow:0 20px 60px #00000080;z-index:50}.tooltip::before{content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:0;height:0;border-top:10px solid transparent;border-bottom:10px solid transparent;border-right:12px solid var(--ant-color-bg-elevated)}.tooltip .step{font-size:11px;letter-spacing:.18em;color:var(--ant-color-primary-text);font-family:ui-monospace,monospace;text-transform:uppercase;margin-bottom:8px}.tooltip h3{font-size:18px;font-weight:600;color:var(--ant-color-text);margin-bottom:8px}.tooltip p{font-size:13px;color:var(--ant-color-text-secondary);line-height:1.6;margin-bottom:18px}.step-dots{display:flex;gap:5px;margin-bottom:14px}.step-dots i{width:6px;height:6px;border-radius:50%;background:var(--ant-color-fill-tertiary)}.step-dots i.on{background:var(--ant-color-primary);width:18px;border-radius:3px}.kbd-hint{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--ant-color-text-tertiary);background:var(--ant-color-bg-elevated);border:1px solid var(--ant-color-border);padding:8px 14px;border-radius:999px;font-family:ui-monospace,monospace}.kbd-hint .k{padding:2px 6px;background:var(--ant-color-fill-secondary);border-radius:3px;color:var(--ant-color-text-secondary)}</style></body>
<div class="stage"><div class="sb"><div class="sb-head">工作区</div><div style="padding:6px 16px;font-size:13px;color:var(--ant-color-text-secondary)">· 我的笔记</div><div style="padding:6px 16px;font-size:13px;color:var(--ant-color-text-secondary)">· 每日日记</div><div style="padding:6px 16px;font-size:13px;color:var(--ant-color-primary-text);background:var(--ant-color-primary-bg);border-left:2px solid var(--ant-color-primary)">· 新画布</div></div><div class="mid"><div class="canvas-bg"></div><div class="spotlight"></div><div class="node" style="left:200px;top:200px"><h4>晨间笔记</h4><div class="meta">日记 · 已创建</div></div><div class="node glow" style="left:440px;top:200px"><h4>设计原则 v3</h4><div class="meta">文档 · 已创建</div><span class="port"></span></div><div class="edge-preview"></div><svg style="position:absolute;inset:0;pointer-events:none"><path d="M 380 230 Q 480 230 540 230" stroke="#14b8a640" stroke-width="1.5" fill="none"/></svg><div class="tooltip"><div class="step">第 4 / 4 步 · CONNECT</div><h3>建立第一个连接</h3><p>Xenica 的核心场景是思考与编辑——节点之间的<b style="color:var(--ant-color-text)">边</b>不是装饰，是关系。<br><br>从节点右侧的 <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ant-color-primary);box-shadow:0 0 6px var(--ant-color-primary);vertical-align:middle"></span> 圆点拖动到另一个节点。或者按 <span style="padding:1px 6px;background:var(--ant-color-fill-secondary);border-radius:3px;font-family:ui-monospace,monospace">⌘L</span>。</p><div class="step-dots"><i></i><i></i><i></i><i class="on"></i></div><div style="display:flex;gap:8px"><button class="btn btn-ghost btn-sm">← 上一步</button><button class="btn btn-primary btn-sm" style="flex:1">✓ 完成引导</button></div></div><div class="kbd-hint">从 <span class="k">●</span> 拖动到目标节点 · <span class="k">⌘L</span> · <span class="k">⌘⇧L</span> 自动布局</div></div></div>
