<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>画布 · 缩略图导航器（特写）· Xenica</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000;color:var(--ant-color-text);font-family:var(--ant-font-family);-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden}
  .stage{padding:60px;background:radial-gradient(circle at 30% 30%,#14b8a608 0%,transparent 60%);min-height:100vh;display:flex;gap:40px;align-items:center;justify-content:center;flex-wrap:wrap}
  .panel{display:flex;flex-direction:column;gap:14px}
  .panel h3{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ant-color-text-tertiary);font-family:ui-monospace,monospace;font-weight:600}
  .panel p{font-size:12px;color:var(--ant-color-text-secondary);max-width:260px;line-height:1.5}
  .mm-demo{width:320px;height:240px;background:var(--ant-color-bg-elevated);border:1px solid var(--ant-color-border);border-radius:12px;padding:14px;box-shadow:0 24px 60px -20px #00000080;position:relative}
  .mm-demo-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .mm-demo-head .ttl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ant-color-text-tertiary);font-family:ui-monospace,monospace}
  .mm-demo-head .ctrl{display:flex;gap:6px;font-size:11px;color:var(--ant-color-text-tertiary)}
  .mm-demo-head .ctrl span{padding:2px 7px;background:var(--ant-color-fill-secondary);border-radius:5px;cursor:default}
  .mm-demo-head .ctrl span.on{background:var(--ant-color-primary-bg);color:var(--ant-color-primary-text)}
  .mm-stage{position:relative;width:100%;height:200px;background:#0a0a0a;border-radius:6px;overflow:hidden;border:1px solid var(--ant-color-border-secondary)}
  .mm-bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:20px 20px}
  .mm-edge{position:absolute;height:1px;background:var(--ant-color-border);transform-origin:left center}
  .mm-node{position:absolute;border-radius:2px;background:var(--xe-node-default);box-shadow:0 0 6px #14b8a640}
  .mm-node.t-purple{background:var(--xe-node-purple);box-shadow:0 0 6px #b37feb60}
  .mm-node.t-blue{background:var(--xe-node-blue);box-shadow:0 0 6px #4096ff60}
  .mm-node.t-yellow{background:var(--xe-node-yellow);box-shadow:0 0 6px #ffc53d60}
  .mm-node.t-green{background:var(--xe-node-green);box-shadow:0 0 6px #95de6460}
  .mm-node.t-pink{background:var(--xe-node-pink);box-shadow:0 0 6px #ff85c060}
  .mm-viewport{position:absolute;border:1.5px solid var(--ant-color-primary-text);background:#14b8a618;box-shadow:0 0 0 9999px #00000040 inset;cursor:move}
  .mm-viewport::after{content:"";position:absolute;inset:0;border:1.5px solid var(--ant-color-primary-text);animation:viewportPulse 1.8s ease-in-out infinite}
  @keyframes viewportPulse{0%,100%{opacity:1}50%{opacity:.5}}
  .mm-compass{position:absolute;top:8px;left:8px;width:32px;height:32px;border-radius:50%;background:var(--ant-color-bg-container);border:1px solid var(--ant-color-border);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ant-color-text-tertiary);font-family:ui-monospace,monospace}
  .legend{position:absolute;bottom:8px;right:8px;display:flex;gap:6px;font-size:10px;color:var(--ant-color-text-tertiary);font-family:ui-monospace,monospace;background:var(--ant-color-bg-container);padding:4px 8px;border-radius:5px;border:1px solid var(--ant-color-border)}
  .legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
  .legend span{display:flex;align-items:center;gap:4px}
  .next-card{background:var(--ant-color-bg-elevated);border:1px solid var(--ant-color-primary-border);border-radius:12px;padding:20px;width:260px;box-shadow:0 0 30px -10px #14b8a650}
  .next-card .ico{width:40px;height:40px;border-radius:10px;background:var(--ant-color-primary-bg);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ant-color-primary-text);margin-bottom:12px}
  .next-card h4{font-size:14px;font-weight:600;margin-bottom:6px}
  .next-card p{font-size:12px;color:var(--ant-color-text-secondary);line-height:1.5}
  .stats{display:flex;gap:12px;margin-top:14px}
  .stats .stat{flex:1;background:var(--ant-color-bg-container);padding:8px 10px;border-radius:6px}
  .stats .stat .n{font-size:18px;font-weight:600;color:var(--ant-color-text);font-variant-numeric:tabular-nums}
  .stats .stat .l{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ant-color-text-tertiary);font-family:ui-monospace,monospace;margin-top:2px}
</style></head><body>
<div class="stage">
  <div class="panel">
    <h3>缩略图导航器 · 1:200</h3>
    <p>鸟瞰整个画布的位置与密度，支持点击或拖拽视口框快速跳转。</p>
    <div class="mm-demo">
      <div class="mm-demo-head"><span class="ttl">缩略图</span><div class="ctrl"><span class="on">节点</span><span>连接</span><span>分组</span></div></div>
      <div class="mm-stage">
        <div class="mm-bg-grid"></div>
        <div class="mm-edge" style="left:18%;top:36%;width:18%"></div>
        <div class="mm-edge" style="left:36%;top:36%;width:14%"></div>
        <div class="mm-edge" style="left:50%;top:24%;width:14%"></div>
        <div class="mm-edge" style="left:18%;top:60%;width:18%"></div>
        <div class="mm-edge" style="left:36%;top:60%;width:14%"></div>
        <div class="mm-node" style="left:16%;top:32%;width:14%;height:8%"></div>
        <div class="mm-node t-blue" style="left:32%;top:32%;width:14%;height:8%"></div>
        <div class="mm-node t-purple" style="left:48%;top:18%;width:18%;height:8%"></div>
        <div class="mm-node t-yellow" style="left:32%;top:56%;width:16%;height:8%"></div>
        <div class="mm-node t-green" style="left:16%;top:56%;width:14%;height:8%"></div>
        <div class="mm-node t-pink" style="left:68%;top:32%;width:14%;height:8%"></div>
        <div class="mm-viewport" style="left:14%;top:22%;width:62%;height:60%"></div>
        <div class="mm-compass">N</div>
        <div class="legend"><span><i style="background:var(--xe-node-default)"></i>日记</span><span><i style="background:var(--xe-node-purple)"></i>文档</span></div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><div class="n">128</div><div class="l">总节点</div></div>
      <div class="stat"><div class="n">17</div><div class="l">视图节点</div></div>
      <div class="stat"><div class="n">13%</div><div class="l">可见比例</div></div>
    </div>
  </div>
  <div class="next-card">
    <div class="ico">⊞</div>
    <h4>快速跳转</h4>
    <p>拖拽视口框（teal 高亮区域）即可重新定位主画布视图。点击任意节点直接跳转到对应位置。</p>
  </div>
</div>
</body></html>
