ound:var(--ant-color-bg-base);border:1px solid var(--ant-color-border);border-radius:8px}.opt .ico{width:20px;height:20px;color:var(--ant-color-primary-text);font-size:14px}.opt .name{flex:1;font-size:13px;color:var(--ant-color-text)}.opt .desc{font-size:11px;color:var(--ant-color-text-tertiary)}.opt input[type=checkbox]{width:18px;height:18px;appearance:none;background:var(--ant-color-bg-elevated);border:1.5px solid var(--ant-color-border);border-radius:4px;cursor:default;display:flex;align-items:center;justify-content:center;color:transparent}.opt input[type=checkbox]:checked{background:var(--ant-color-primary);border-color:var(--ant-color-primary);color:#fff}.opt input[type=checkbox]:checked::before{content:"✓";font-size:11px;font-weight:600}.foot{padding:18px 28px;border-top:1px solid var(--ant-color-border);background:var(--ant-color-bg-container);display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--ant-color-text-tertiary);font-family:ui-monospace,monospace}</style></body>
