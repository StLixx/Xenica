<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>主框架 · 左侧栏展开（树形）· Xenica</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000;color:var(--ant-color-text);font-family:var(--ant-font-family);-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden}
  .app{height:100vh;display:grid;grid-template-rows:36px 1fr 28px;grid-template-columns:280px 1fr}
  .hd{grid-column:1/-1;background:var(--ant-color-bg-elevated);border-bottom:1px solid var(--ant-color-border);display:flex;align-items:center;padding:0 16px;gap:12px;font-size:12px}
  .hd .brand{font-weight:700;letter-spacing:.14em}
  .hd .brand .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ant-color-primary);box-shadow:0 0 6px var(--ant-color-primary);margin-right:8px;vertical-align:middle}
  .hd .crumbs{color:var(--ant-color-text-secondary)}
  .hd .crumbs b{color:var(--ant-color-text);font-weight:500}
  .hd .right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--ant-color-text-tertiary)}
  .sb{background:var(--ant-color-bg-base);border-right:1px solid var(--ant-color-border);padding:10px 0;overflow:auto;font-size:13px}
  .sb-head{padding:6px 16px;display:flex;align-items:center;justify-content:space-between}
  .sb-search{margin:8px 12px;padding:7px 12px;background:var(--ant-color-bg-container);border:1px solid var(--ant-color-border);border-radius:6px;font-size:12px;color:var(--ant-color-text-tertiary);display:flex;align-items:center;gap:8px}
  .sb-search input{background:transparent;border:none;outline:none;color:var(--ant-color-text);flex:1;font-size:12px;font-family:inherit}
  .sb-section{padding:10px 16px 4px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ant-color-text-tertiary);display:flex;align-items:center;gap:6px;cursor:default}
  .sb-section .chev{font-size:9px;opacity:.6}
  .tree{padding-left:0}
  .tn{display:flex;align-items:center;gap:8px;padding:5px 16px 5px 28px;font-size:12.5px;color:var(--ant-color-text-secondary);cursor:default;position:relative}
  .tn:hover{background:var(--ant-color-fill-secondary);color:var(--ant-color-text)}
  .tn.on{background:var(--ant-color-primary-bg);color:var(--ant-color-primary-text)}
  .tn .chev{width:14px;font-size:9px;color:var(--ant-color-text-tertiary)}
  .tn .glyph{font-size:11px;opacity:.7}
  .tn .badge{margin-left:auto;font-size:10px;background:var(--ant-color-fill-tertiary);color:var(--ant-color-text-tertiary);padding:1px 6px;border-radius:8px}
  .tn-l2{padding-left:48px}
  .tn-l3{padding-left:68px;font-size:12px;color:var(--ant-color-text-tertiary)}
  .mid{background:var(--ant-color-bg-layout);position:relative;overflow:hidden}
  .canvas-bg{position:absolute;inset:0;background-image:var(--xe-bg-grid);background-size:40px 40px;opacity:.5}
  .node{position:absolute;background:var(--ant-color-bg-elevated);border:1px solid var(--ant-color-border);border-radius:10px;padding:14px 18px;min-width:200px;font-size:13px;box-shadow:0 4px 16px #00000060}
  .node h4{font-size:13px;font-weight:600;margin-bottom:6px}
  .node p{font-size:11px;color:var(--ant-color-text-secondary);line-height:1.4}
  .ft{grid-column:1/-1;background:var(--ant-color-bg-elevated);border-top:1px solid var(--ant-color-border);padding:0 14px;display:flex;align-items:center;font-size:11px;color:var(--ant-color-text-secondary)}
  .ft .right{margin-left:auto}
</style></head><body>
<div class="app">
  <div class="hd">
    <div class="brand"><span class="dot"></span>XENICA</div>
    <div class="crumbs">· 工作区 · <b>研究项目</b> · Antd 6 调研</div>
    <div class="right"><span style="color:var(--ant-color-success)">● 已同步</span><span>⌘K</span><div class="av" style="width:22px;height:22px;font-size:10px">XL</div></div>
  </div>
  <div class="sb">
    <div class="sb-search">⌕<input placeholder="搜索节点..."/></div>
    <div class="sb-section"><span class="chev">▾</span><span>收藏</span></div>
    <div class="tree">
      <div class="tn"><span class="chev">▾</span><span class="glyph">◉</span>节点画布<span class="badge">128</span></div>
      <div class="tn tn-l2"><span class="chev">▾</span><span class="glyph">▤</span>研究项目</div>
      <div class="tn tn-l3 on"><span class="glyph">·</span>Antd 6 调研</div>
      <div class="tn tn-l3"><span class="glyph">·</span>Notion 对比</div>
      <div class="tn tn-l3"><span class="glyph">·</span>Obsidian 对比</div>
      <div class="tn tn-l2"><span class="chev">▾</span><span class="glyph">✎</span>每日日记</div>
      <div class="tn tn-l3"><span class="glyph">·</span>2026-07</div>
      <div class="tn tn-l3"><span class="glyph">·</span>2026-06</div>
      <div class="tn"><span class="chev">▸</span><span class="glyph">▦</span>阅读清单<span class="badge">17</span></div>
      <div class="tn"><span class="chev">▸</span><span class="glyph">⌬</span>项目看板<span class="badge">9</span></div>
    </div>
    <div class="sb-section" style="margin-top:10px"><span class="chev">▾</span><span>私人</span></div>
    <div class="tree">
      <div class="tn"><span class="chev">▸</span><span class="glyph">✎</span>草稿<span class="badge">2</span></div>
      <div class="tn"><span class="chev">▸</span><span class="glyph">⊟</span>归档<span class="badge">12</span></div>
    </div>
  </div>
  <div class="mid">
    <div class="canvas-bg"></div>
    <svg style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none">
      <path d="M 280 240 Q 400 200 540 240" class="edge"/>
      <path d="M 540 240 Q 660 320 720 440" class="edge"/>
      <path d="M 280 240 Q 200 360 220 480" class="edge"/>
    </svg>
    <div class="node" style="left:200px;top:200px"><h4>Antd 6 调研笔记</h4><p>darkAlgorithm + token 注入</p></div>
    <div class="node" style="left:460px;top:200px"><h4>组件覆盖度</h4><p>与官方对比 · Antd 占优</p></div>
    <div class="node" style="left:640px;top:400px"><h4>迁移成本估算</h4><p>~1 周 · 影响 v5.0.0 范围</p></div>
  </div>
  <div class="ft"><span>5 节点</span><span>·</span><span>3 连接</span><span class="right">布局 · 自动 · ⌘K</span></div>
</div>
</body></html>
