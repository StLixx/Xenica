<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>引导 · 完成 · 解锁功能 · Xenica</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>*{box-sizing:border-box;margin:0;padding:0}html,body{background:#000;color:var(--ant-color-text);font-family:var(--ant-font-family);-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#14b8a614 0%,transparent 60%)}.card{background:var(--ant-color-bg-elevated);border:1px solid var(--ant-color-primary-border);border-radius:24px;padding:56px 64px;width:680px;box-shadow:0 40px 100px -20px #00000080,0 0 60px -10px #14b8a640;text-align:center;position:relative;overflow:hidden}.card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--ant-color-primary),transparent)}.badge-circle{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,#14b8a6,#0d9488);display:flex;align-items:center;justify-content:center;color:#fff;font-size:44px;margin:0 auto 24px;box-shadow:0 16px 40px -8px #14b8a680;animation:bob 2.4s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}.badge-circle::after{content:"";position:absolute;inset:-8px;border:2px dashed #14b8a640;border-radius:50%;animation:spin 8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.step-tag{display:inline-block;font-size:11px;letter-spacing:.18em;color:var(--ant-color-primary-text);background:var(--ant-color-primary-bg);padding:5px 12px;border-radius:999px;font-family:ui-monospace,monospace;margin-bottom:14px}.card h1{font-size:32px;font-weight:600;letter-spacing:-.01em;color:var(--ant-color-text);margin-bottom:12px}.card>p{font-size:14px;color:var(--ant-color-text-secondary);line-height:1.7;margin-bottom:32px;max-width:480px;margin-left:auto;margin-right:auto}.unlock-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:32px;text-align:left}.unlock{background:var(--ant-color-bg-base);border:1px solid var(--ant-color-border);border-radius:10px;padding:14px 16px}.unlock .ico{width:32px;height:32px;border-radius:8px;background:var(--ant-color-primary-bg);color:var(--ant-color-primary-text);display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:10px}.unlock h4{font-size:12px;font-weight:600;color:var(--ant-color-text);margin-bottom:2px}.unlock p{font-size:11px;color:var(--ant-color-text-tertiary);margin:0;line-height:1.4}.ctas{display:flex;gap:8px;justify-content:center}.shortcuts{display:flex;justify-content:center;gap:14px;font-size:11px;color:var(--ant-color-text-tertiary);font-family:ui-monospace,monospace;margin-top:18px;padding-top:18px;border-top:1px solid var(--ant-color-border)}.shortcuts .k{padding:2px 6px;background:var(--ant-color-fill-secondary);border-radius:3px;color:var(--ant-color-text-secondary)}</style></body>
<div class="card"><div class="badge-circle">✓</div><div class="step-tag">完成 · ONBOARDING COMPLETE</div><h1>欢迎加入 Xenica</h1><p>你已经创建了第一个节点并建立了第一个连接。下方是为你解锁的功能：</p><div class="unlock-grid"><div class="unlock"><div class="ico">⌬</div><h4>数据库视图</h4><p>5 种视图：表格 / 看板 / 日历 / 画廊 / 时间线</p></div><div class="unlock"><div class="ico">⤓</div><h4>导入与导出</h4><p>支持 Markdown / JSON / Notion / Obsidian</p></div><div class="unlock"><div class="ico">⇪</div><h4>协作</h4><p>邀请团队成员共同编辑（Pro）</p></div><div class="unlock"><div class="ico">▦</div><div></div><h4>扩展</h4><p>安装第三方扩展增强画布</p></div><div class="unlock"><div class="ico">⌘</div><h4>快捷键</h4><p>30+ 个高效快捷键</p></div><div class="unlock"><div class="ico">⚙</div><h4>深度定制</h4><p>主题 / 字体 / 间距 / 自动布局参数</p></div></div><div class="ctas"><button class="btn btn-default btn-lg">⌒ 浏览示例</button><button class="btn btn-primary btn-lg">→ 进入画布</button></div><div class="shortcuts"><span><span class="k">⌘K</span> 命令面板</span><span><span class="k">⌘\\</span> 切换侧栏</span><span><span class="k">⌘⇧L</span> 自动布局</span></div></div>
</body></html>
