<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>命令面板 · 历史记录 · Xenica</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>*{box-sizing:border-box;margin:0;padding:0}html,body{background:#000;color:var(--ant-color-text);font-family:var(--ant-font-family);-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden}.stage{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;padding-top:100px;background:rgba(0,0,0,.5);backdrop-filter:blur(8px)}.panel{width:720px;background:var(--ant-color-bg-elevated);border:1px solid var(--ant-color-border);border-radius:14px;box-shadow:0 40px 100px -20px #000000c0;overflow:hidden}.search{padding:16px 22px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--ant-color-border);background:var(--ant-color-bg-container)}.search .ico{font-size:18px;color:var(--ant-color-text-tertiary)}.search input{flex:1;background:transparent;border:none;outline:none;color:var(--ant-color-text);font-size:17px;font-family:inherit}.search input::placeholder{color:var(--ant-color-text-tertiary)}.kbd-hint{font-family:ui-monospace,monospace;font-size:11px;color:var(--ant-color-text-tertiary);background:var(--ant-color-fill-secondary);padding:3px 7px;border-radius:4px;border:1px solid var(--ant-color-border)}.tabs{display:flex;gap:0;padding:0 14px;background:var(--ant-color-bg-container);border-bottom:1px solid var(--ant-color-border)}.tab{padding:9px 14px;font-size:12px;color:var(--ant-color-text-secondary);border-bottom:2px solid transparent;cursor:default;display:flex;align-items:center;gap:5px;letter-spacing:.04em;font-family:ui-monospace,monospace}.tab.on{color:var(--ant-color-primary-text);border-bottom-color:var(--ant-color-primary)}.tab .c{font-size:10px;background:var(--ant-color-fill-secondary);padding:1px 5px;border-radius:6px}.section{padding:14px 0 6px}.section-title{padding:6px 22px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ant-color-text-tertiary);font-family:ui-monospace,monospace;display:flex;align-items:center;justify-content:space-between}.section-title .clear{color:var(--ant-color-primary-text);cursor:default;font-size:10px}.item{display:flex;align-items:center;gap:14px;padding:10px 22px;font-size:13.5px;color:var(--ant-color-text-secondary);cursor:default}.item:hover{background:var(--ant-color-fill-secondary);color:var(--ant-color-text)}.item.on{background:var(--ant-color-primary-bg);color:var(--ant-color-primary-text)}.ico{width:24px;height:24px;border-radius:6px;background:var(--ant-color-fill-secondary);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ant-color-text-secondary);flex:none}.item.on .ico{background:var(--ant-color-primary);color:#fff}.info{flex:1;min-width:0}.info .ttl{font-size:14px;font-weight:500}.info .dsc{font-size:11px;color:var(--ant-color-text-tertiary);margin-top:1px}.item-kbd{font-family:ui-monospace,monospace;font-size:10px;color:var(--ant-color-text-tertiary)}.item-kbd span{padding:2px 6px;background:var(--ant-color-fill-secondary);border-radius:3px;margin-left:3px}.item-time{font-family:ui-monospace,monospace;font-size:10px;color:var(--ant-color-text-tertiary)}.foot{padding:10px 22px;border-top:1px solid var(--ant-color-border);background:var(--ant-color-bg-container);display:flex;justify-content:space-between;font-size:11px;color:var(--ant-color-text-tertiary);font-family:ui-monospace,monospace}</style></body>
<div class="stage"><div class="panel"><div class="search"><span class="ico">⌕</span><input placeholder="搜索命令、节点、设置..."/><span class="kbd-hint">ESC</span></div><div class="tabs"><div class="tab on">全部 <span class="c">30</span></div><div class="tab">命令 <span class="c">18</span></div><div class="tab">节点 <span class="c">8</span></div><div class="tab">最近 <span class="c">5</span></div></div><div class="section"><div class="section-title"><span>最近使用 · 5 项</span><span class="clear">清空</span></div><div class="item"><div class="ico">▦</div><div class="info"><div class="ttl">新建节点画布</div><div class="dsc">空白画布 · 自动布局</div></div><span class="item-time">5 分钟前</span></div><div class="item on"><div class="ico">⌘</div><div class="info"><div class="ttl">全局搜索</div><div class="dsc">跨工作区搜索节点、数据库、设置</div></div><span class="item-time">12 分钟前</span></div><div class="item"><div class="ico">⊞</div><div class="info"><div class="ttl">切换主题</div><div class="dsc">暗色 / 亮色 / 跟随系统</div></div><span class="item-time">1 小时前</span></div><div class="item"><div class="ico">✥</div><div class="info"><div class="ttl">自动布局</div><div class="dsc">按连接关系重排所有节点</div></div><span class="item-time">2 小时前</span></div><div class="item"><div class="ico">⇪</div><div class="info"><div class="ttl">分享当前画布</div><div class="dsc">生成链接 / 设置权限</div></div><span class="item-time">昨天</span></div></div><div class="section"><div class="section-title">节点操作</div><div class="item"><div class="ico">+</div><div class="info"><div class="ttl">新建节点</div><div class="dsc">在当前画布新建一个节点</div></div><span class="item-kbd"><span>⌘</span><span>↵</span></span></div><div class="item"><div class="ico">↔</div><div class="info"><div class="ttl">建立连接</div><div class="dsc">从选中节点连接到目标</div></div><span class="item-kbd"><span>⌘</span><span>L</span></span></div></div><div class="section"><div class="section-title">导航</div><div class="item"><div class="ico">▦</div><div class="info"><div class="ttl">切换到阅读清单</div><div class="dsc">工作区 · 17 项</div></div></div></div><div class="foot"><span><kbd style="padding:1px 5px;background:var(--ant-color-fill-secondary);border-radius:3px">↑</kbd><kbd style="padding:1px 5px;background:var(--ant-color-fill-secondary);border-radius:3px">↓</kbd> 移动 · <kbd style="padding:1px 5px;background:var(--ant-color-fill-secondary);border-radius:3px">↵</kbd> 选择</span><span>Xenica · 命令面板</span></div></div></div>
</body></html>
