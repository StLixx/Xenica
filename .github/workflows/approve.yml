name: approve

# 你在 PR 里评论 /通过 = 验收通过。只认仓库所有者。
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write
  actions: write

jobs:
  approve:
    if: >-
      github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '/通过 ') || startsWith(github.event.comment.body, '/验收 ') || startsWith(github.event.comment.body, '/自检 ')) &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: candidate
        name: 查找当前成果的最新流水线尝试
        uses: actions/github-script@v8
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: context.issue.number });
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id: 'ci.yml', head_sha: pr.head.sha, event: 'pull_request',
            });
            const latest = runs.filter(r => r.head_sha === pr.head.sha && r.head_branch === pr.head.ref).sort((a,b) => b.id-a.id)[0];
            if (!latest) throw new Error('没有对应成果的流水线证据');
            if (pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) throw new Error('只执行本仓库的交付门');
            core.setOutput('head',pr.head.sha);
            core.setOutput('run', latest.id);
            core.setOutput('attempt', latest.run_attempt);
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.candidate.outputs.head }}
      - uses: actions/github-script@v8
        env:
          HEAD: ${{ steps.candidate.outputs.head }}
          RUN: ${{ steps.candidate.outputs.run }}
          ATTEMPT: ${{ steps.candidate.outputs.attempt }}
        with:
          script: |
            const candidate=await require('./.github/scripts/find-candidate.cjs')({github,...context.repo,source:process.env.HEAD,run:Number(process.env.RUN),attempt:Number(process.env.ATTEMPT)});
            require('node:fs').mkdirSync('.delivery',{recursive:true});
            require('node:fs').writeFileSync('.delivery/delivery-candidate.json',JSON.stringify(candidate));
      - uses: actions/github-script@v8
        with:
          script: |
            await github.rest.reactions.createForIssueComment({ ...context.repo, comment_id: context.payload.comment.id, content: '+1' });
      - id: gate
        uses: actions/github-script@v8
        with:
          script: |
            const gate = require('./.github/scripts/gate.cjs');
            await gate({ github, context, core, mode: context.payload.comment.body.startsWith('/自检 ') ? 'selftest' : 'approve' });
      - name: 看板
        if: steps.gate.outputs.issues != '[]'
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          ISSUES: ${{ steps.gate.outputs.issues }}
          STAGE: ${{ steps.gate.outputs.stage }}
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const project = require('./.github/scripts/project.cjs');
            await project({ github, core, ...context.repo, contentIds: JSON.parse(process.env.ISSUES), stage: process.env.STAGE });
