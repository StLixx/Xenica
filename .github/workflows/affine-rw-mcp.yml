name: AFFiNE read write MCP gateway
on:
  pull_request:
    paths: [deploy/affine-rw-mcp/**, .github/workflows/affine-rw-mcp.yml]
  push:
    branches: [79-affine-rw-mcp, master]
    paths: [deploy/affine-rw-mcp/**, .github/workflows/affine-rw-mcp.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t affine-rw-gateway:test deploy/affine-rw-mcp
      - run: docker run --rm --network none -v "$PWD/deploy/affine-rw-mcp:/test:ro" --workdir /test --entrypoint python affine-rw-gateway:test -m unittest -v test_gateway
