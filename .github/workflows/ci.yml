name: ci

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/xenica

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xenica
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli@0.9.0
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      - name: architecture
        run: bash scripts/check-arch.sh
      - name: sqlx offline cache is up to date
        run: |
          cargo sqlx migrate run --source crates/store/migrations
          SQLX_OFFLINE=false cargo sqlx prepare --workspace --check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm arch
      - run: pnpm build
      - run: pnpm build-storybook --quiet

  # 前后端契约 + 端到端：真实数据库、真实服务、真实浏览器。
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xenica
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: cargo build --locked -p xenica-server
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: OpenAPI 与前端类型没有漂移
        run: |
          ./target/debug/xenica openapi > web/src/api/openapi.json
          (cd web && pnpm api)
          git diff --exit-code -- web/src/api || {
            echo "::error::接口变了但没重新生成。运行：cargo run -p xenica-server -- openapi > web/src/api/openapi.json && (cd web && pnpm api)"
            exit 1
          }
      - run: pnpm build
        working-directory: web
      - name: start server
        run: |
          XENICA_WEB_DIST=web/dist ./target/debug/xenica serve > server.log 2>&1 &
          for i in $(seq 1 30); do ./target/debug/xenica healthcheck && exit 0; sleep 1; done
          cat server.log; exit 1
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm e2e
        working-directory: web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            web/playwright-report
            server.log

  docker:
    runs-on: ubuntu-latest
    needs: [rust, web, e2e]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/stlixx/xenica:latest
            ghcr.io/stlixx/xenica:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
