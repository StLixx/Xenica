name: ci

# 合并只集成并校验；正式版本推广由 release.yml 执行，见 ADR 0015。
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [master]
  # 验收门用 GITHUB_TOKEN 合并后不会触发 push，由它手动触发 master 的这条流水线。
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/xenica

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: PR 标题符合 Conventional Commits
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node .github/scripts/check-pr-title.cjs

  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xenica
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli@0.9.0
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      - name: architecture
        run: bash scripts/check-arch.sh
      - name: AGENTS.md 不超过 200 行
        run: bash scripts/check-docs.sh
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: 门禁负向回归
        run: node --test .github/scripts/tests/*.test.cjs
      - name: 接续索引完整性
        run: node scripts/check-context.cjs
      - name: 前后端与发布声明版本一致
        run: node .github/scripts/check-release.cjs
      - name: 原始画板迁移无损回归
        run: |
          python3 scripts/test-excalidraw-archive.py
          python3 scripts/test-deployer.py
          python3 scripts/test-history.py
          python3 scripts/test-workspace.py
          python3 scripts/test-release-deployment.py
          python3 scripts/test-preview-access.py
      - name: sqlx offline cache is up to date
        run: |
          cargo sqlx migrate run --source crates/store/migrations
          SQLX_OFFLINE=false cargo sqlx prepare --workspace --check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm arch
      - run: pnpm build

  # 前后端契约 + 端到端：真实数据库、真实服务、真实浏览器。
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xenica
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: cargo build --locked -p xenica-server
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: OpenAPI 与前端类型没有漂移
        run: |
          ./target/debug/xenica openapi > web/src/api/openapi.json
          (cd web && pnpm api)
          git diff --exit-code -- web/src/api || {
            echo "::error::接口变了但没重新生成。运行：cargo run -p xenica-server -- openapi > web/src/api/openapi.json && (cd web && pnpm api)"
            exit 1
          }
      - run: pnpm build
        working-directory: web
      - name: start server
        run: |
          XENICA_SEED=demo XENICA_WEB_DIST=web/dist ./target/debug/xenica serve > server.log 2>&1 &
          for _ in $(seq 1 30); do ./target/debug/xenica healthcheck && exit 0; sleep 1; done
          cat server.log; exit 1
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm e2e
        working-directory: web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            web/playwright-report
            server.log

  # 每个 story 截图。master 上的截图就是基准；PR 和它比，有变化的列给验收门。
  # 固定在 Playwright 官方容器里跑，保证字体渲染一致。
  screenshots:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    permissions:
      contents: read
      actions: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build-storybook --quiet
      - name: 真实组件与设计变量目录没有漂移
        run: node ../scripts/generate-design-catalog.cjs --check
      - if: github.event_name == 'pull_request'
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ci.yml
          branch: master
          name: screenshot-baseline
          path: web/screenshots/__baseline__
          if_no_artifact_found: warn
      - id: compare
        name: compare
        env:
          HOME: /root
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            pnpm screenshots || true
            changed=$(node -e '
              const r = require("./screenshots/__results__/report.json"), out = [];
              const walk = (s) => { (s.suites ?? []).forEach(walk); (s.specs ?? []).forEach((t) => t.ok || out.push(t.title)); };
              r.suites.forEach(walk);
              console.log(JSON.stringify(out));')
            echo "changed=$changed" >> "$GITHUB_OUTPUT"
            echo "有变化的 story：$changed"
          else
            pnpm screenshots --update-snapshots=all
            echo "changed=[]" >> "$GITHUB_OUTPUT"
          fi
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-baseline
          path: web/screenshots/__baseline__
          retention-days: 90
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diff
          path: web/screenshots/__results__
          if-no-files-found: ignore

  # 应用镜像。PR（本仓库分支）推 pr-<号>，部署器据此起预览；master 推 latest，部署器上线正式站。
  docker:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [rust, web, e2e]
    permissions:
      contents: write
      packages: write
    env:
      PUSH: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name != 'pull_request' && github.ref == 'refs/heads/master') }}
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TAG: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'latest' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v3
      - id: retained
        name: 相同源码重跑复用永久产物
        if: env.PUSH == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const artifact=await require('./.github/scripts/find-source-artifact.cjs')({github,...context.repo,source:process.env.SHA});
            core.setOutput('artifact',artifact || '');
      - if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        if: steps.retained.outputs.artifact == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          build-args: XENICA_COMMIT=${{ env.SHA }}
          labels: org.opencontainers.image.revision=${{ env.SHA }}
          tags: |
            ghcr.io/stlixx/xenica:${{ env.TAG }}
            ghcr.io/stlixx/xenica:${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: steps.retained.outputs.artifact != ''
        name: 核验并关联同一不可变镜像
        env:
          RETAINED: ${{ steps.retained.outputs.artifact }}
        run: |
          image="ghcr.io/stlixx/xenica@$RETAINED"
          docker pull "$image"
          test "$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$SHA"
          actual=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -r .digest)
          test "$actual" = "$RETAINED"
          docker buildx imagetools create --prefer-index=false --tag "ghcr.io/stlixx/xenica:$TAG" "$image"
          test "$(docker buildx imagetools inspect "ghcr.io/stlixx/xenica:$TAG" --format '{{json .Manifest}}' | jq -r .digest)" = "$RETAINED"
      - if: github.event_name == 'pull_request' && env.PUSH == 'true'
        name: 生成交付候选身份
        uses: actions/github-script@v8
        env:
          ARTIFACT_DIGEST: ${{ steps.retained.outputs.artifact || steps.image.outputs.digest }}
        with:
          script: |
            const buildCandidate = require('./.github/scripts/build-candidate.cjs');
            const candidate = buildCandidate({
              root: process.cwd(), source: context.payload.pull_request.head.sha,
              base: context.payload.pull_request.base.sha, artifact: process.env.ARTIFACT_DIGEST,
              number: context.payload.pull_request.number, run: Number(process.env.GITHUB_RUN_ID),
              attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              workspace: context.payload.pull_request.labels.some(label => label.name === '固定画板') ? 'https://excalidraw.xenica.truebigsand.top' : undefined,
            });
            require('node:fs').writeFileSync('delivery-candidate.json', JSON.stringify(candidate, null, 2));
            await require('./.github/scripts/journal.cjs')({github,...context.repo,record:{schema:1,type:'candidate',candidate}});
            core.info(`交付候选：${candidate.id}`);
      - if: github.event_name == 'pull_request' && env.PUSH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: delivery-candidate-${{ github.run_attempt }}
          path: delivery-candidate.json
          if-no-files-found: error

  # 测试实际交付的预览；master 合并只校验，明确 release 操作才推广。
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: [docker]
    env:
      XENICA_URL: https://pr-${{ github.event.pull_request.number }}.xenica.truebigsand.top
      EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: delivery-candidate-${{ github.run_attempt }}
          path: .delivery
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: 等待对应成果实际上线
        run: |
          expected_artifact=$(jq -r '.artifact' .delivery/delivery-candidate.json)
          for _ in $(seq 1 60); do
            health=$(curl -fsS --max-time 10 "$XENICA_URL/api/health") || health='{}'
            if [ "$(jq -r '.commit // empty' <<<"$health")" = "$EXPECTED_SOURCE" ] &&
               [ "$(jq -r '.artifact // empty' <<<"$health")" = "$expected_artifact" ]; then exit 0; fi
            sleep 10
          done
          echo '::error::预览没有部署对应成果，不能交付验收'; exit 1
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - name: 实际预览完整浏览器回归
        env:
          XENICA_REQUIRE_HISTORY: '1'
          XENICA_E2E_SESSIONS: ${{ secrets[format('XENICA_PREVIEW_SESSIONS_{0}', github.event.pull_request.number)] }}
        run: |
          test -n "$XENICA_E2E_SESSIONS" || { echo '::error::缺少私有预览的短期测试授权；不使用公开示例密码回退'; exit 1; }
          pnpm e2e --workers=1
        working-directory: web
      - name: 测试结束再次核对成果
        run: |
          health=$(curl -fsS --max-time 10 "$XENICA_URL/api/health")
          test "$(jq -r '.commit' <<<"$health")" = "$EXPECTED_SOURCE"
          test "$(jq -r '.artifact' <<<"$health")" = "$(jq -r '.artifact' .delivery/delivery-candidate.json)"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-agent-tests-${{ github.run_attempt }}
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: error

  # 成功和失败检查都长期保存，不依赖附件保留期。
  delivery-history:
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: [pr-title, rust, web, e2e, screenshots, docker, preview]
    permissions:
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/github-script@v8
        env:
          RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const checks=await github.paginate(github.rest.checks.listForRef,{...context.repo,ref:context.payload.pull_request.head.sha});
            const latest=[...require('./.github/scripts/candidate.cjs').latestChecks(checks).values()].map(({id,name,conclusion,details_url})=>({id,name,conclusion,url:details_url}));
            await require('./.github/scripts/journal.cjs')({github,...context.repo,record:{schema:1,type:'engineering',source:context.payload.pull_request.head.sha,run:Number(process.env.GITHUB_RUN_ID),attempt:Number(process.env.GITHUB_RUN_ATTEMPT),results:JSON.parse(process.env.RESULTS),checks:latest}});

  # Agent 全面自检完成后才可进入用户体验验收。
  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [pr-title, rust, web, e2e, screenshots, docker, preview, delivery-history]
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: delivery-candidate-${{ github.run_attempt }}
          path: .delivery
      - id: gate
        uses: actions/github-script@v8
        env:
          CHANGED: ${{ needs.screenshots.outputs.changed }}
        with:
          script: |
            const gate = require('./.github/scripts/gate.cjs');
            await gate({ github, context, core, mode: 'ci', changed: JSON.parse(process.env.CHANGED || '[]') });
      - name: 看板
        if: steps.gate.outputs.issues != '[]'
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          ISSUES: ${{ steps.gate.outputs.issues }}
          STAGE: ${{ steps.gate.outputs.stage }}
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const project = require('./.github/scripts/project.cjs');
            await project({ github, core, ...context.repo, contentIds: JSON.parse(process.env.ISSUES), stage: process.env.STAGE });
