name: 缺陷
description: 用的时候出了问题
labels: [缺陷]
body:
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 看到了什么，最好附截图。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望是什么
  - type: textarea
    id: steps
    attributes:
      label: 怎么出现的
      description: 记得多少写多少，复现由 AI 来做。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 界面底部的版本和 commit；在哪个设备、哪个浏览器
